<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬鈴薯深空戰記 (Space Spud: Arena)</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #1a1c23; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #gameCanvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle at center, #252836 0%, #101218 100%); }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; z-index: 20; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .hud-panel { background: rgba(20, 25, 35, 0.85); border: 2px solid #ffcc00; border-radius: 10px; padding: 10px 15px; backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(255, 204, 0, 0.3); }
        .player-stats { font-size: 13px; line-height: 1.5; }
        .player-stats span { color: #ffcc00; font-weight: bold; }
        .btn-pause-hud { pointer-events: auto; background: rgba(255, 204, 0, 0.2); border: 2px solid #ffcc00; color: #ffcc00; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; position: relative; z-index: 30; }
        .btn-pause-hud:active { background: rgba(255, 204, 0, 0.5); transform: scale(0.95); }
        .controls-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; display: none; z-index: 10; }
        .touch-active .controls-layer { display: block; }
        .joystick-base { position: absolute; width: 120px; height: 120px; margin-left: -60px; margin-top: -60px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 204, 0, 0.5); border-radius: 50%; pointer-events: none; display: none; }
        .joystick-thumb { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; margin-left: -25px; margin-top: -25px; background: rgba(255, 204, 0, 0.4); border: 2px solid #ffcc00; border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(16, 18, 24, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }
        .modal-title { font-size: 28px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 20px rgba(255, 204, 0, 0.6); margin-bottom: 8px; letter-spacing: 2px; text-align: center; }
        .modal-subtitle { font-size: 13px; color: #b0b5c0; margin-bottom: 20px; text-align: center; padding: 0 20px; }
        .btn-main { background: linear-gradient(135deg, #ffcc00, #ff6600); color: #101218; border: none; padding: 12px 35px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); transition: all 0.2s; }
        .btn-main:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 204, 0, 0.8); }
        .shop-grid { display: flex; gap: 12px; max-width: 950px; width: 90%; justify-content: center; flex-wrap: wrap; }
        .shop-card { background: rgba(25, 30, 42, 0.95); border: 2px solid rgba(255, 204, 0, 0.4); border-radius: 10px; padding: 12px; width: 190px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .shop-card:hover { border-color: #ffcc00; transform: translateY(-4px); box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }
        .shop-card-title { font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 5px; }
        .shop-card-desc { font-size: 11px; color: #b0b5c0; line-height: 1.4; margin-bottom: 8px; }
        .shop-card-price { font-size: 12px; color: #00ffcc; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 500px; width: 90%; background: rgba(20, 25, 35, 0.9); border: 2px solid rgba(255, 204, 0, 0.4); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .stat-item { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .stat-label { color: #b0b5c0; } .stat-value { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer"><div class="hud-top"><div class="hud-panel player-stats"><div>波次 (Wave): <span id="hud-wave">1</span></div><div>生命值 (HP): <span id="hud-hp">100/100</span></div><div>金幣 (Materials): <span id="hud-gold">0</span></div><div>存活倒數: <span id="hud-time">25s</span></div></div><div><button class="btn-pause-hud" id="pauseBtn">暫停 / 數據</button></div></div></div>
    <div class="controls-layer" id="controlsLayer"><div class="joystick-base" id="joystickBase"><div class="joystick-thumb" id="joystickThumb"></div></div></div>
    <div class="modal-overlay" id="startMenu"><div class="modal-title">馬鈴薯深空戰記</div><div class="modal-subtitle">SPACE SPUD: ARENA SURVIVAL</div><button class="btn-main" id="startBtn">進入戰鬥</button></div>
    <div class="modal-overlay" id="pauseMenu" style="display: none;"><div class="modal-title">遊戲暫停</div><div class="modal-subtitle">當前馬鈴薯實時數值面板</div><div class="stats-grid" id="statsGrid"></div><button class="btn-main" id="resumeBtn">返回戰鬥</button></div>
    <div class="modal-overlay" id="shopMenu" style="display: none;"><div class="modal-title">戰利品商店 (SHOP)</div><div class="modal-subtitle">購買強力道具來武裝你的馬鈴薯！</div><div class="shop-grid" id="shopGrid"></div><div style="margin-top: 25px;"><button class="btn-main" id="nextWaveBtn">下一波戰鬥</button></div></div>
    <div class="modal-overlay" id="gameOverMenu" style="display: none;"><div class="modal-title" style="color: #ff3366;">馬鈴薯倒下了 (GAME OVER)</div><div class="modal-subtitle" id="gameOverStats">撐到了第 1 波 | 擊殺數: 0</div><button class="btn-main" id="restartBtn">再次挑戰</button></div>
<script>
let audioCtx=null;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playSound(type){if(!audioCtx)return;try{let osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.connect(gain);gain.connect(audioCtx.destination);if(type==='shoot'){osc.type='triangle';osc.frequency.setValueAtTime(400,now);osc.frequency.exponentialRampToValueAtTime(100,now+.05);gain.gain.setValueAtTime(.08,now);gain.gain.linearRampToValueAtTime(.01,now+.05);osc.start(now);osc.stop(now+.05)}else if(type==='hit'){osc.type='sawtooth';osc.frequency.setValueAtTime(120,now);osc.frequency.linearRampToValueAtTime(30,now+.08);gain.gain.setValueAtTime(.12,now);gain.gain.linearRampToValueAtTime(.01,now+.08);osc.start(now);osc.stop(now+.08)}else if(type==='coin'){osc.type='sine';osc.frequency.setValueAtTime(800,now);osc.frequency.exponentialRampToValueAtTime(1400,now+.1);gain.gain.setValueAtTime(.15,now);gain.gain.linearRampToValueAtTime(.01,now+.1);osc.start(now);osc.stop(now+.1)}}catch(e){}}
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}window.addEventListener('resize',resizeCanvas);resizeCanvas();
let gameState='START',wave=1,waveTimer=25,timerInterval=null,kills=0;
let player={x:canvas.width/2,y:canvas.height/2,radius:18,speed:4,maxHp:100,hp:100,hpRegen:0,armor:0,gold:0,attackSpeed:32,damage:20,range:240,vampire:0,critChance:.15,critDamage:1.5};
let enemies=[],bullets=[],materials=[],particles=[],damageNumbers=[],enemySpawnCounter=0;
const itemPool=[{id:'gun',title:'突擊小槍',desc:'攻擊傷害提升 8 點。',price:30,apply:()=>player.damage+=8},{id:'speed',title:'跑鞋',desc:'移動速度提升 20%。',price:25,apply:()=>player.speed+=1},{id:'attackSpeed',title:'咖啡因',desc:'攻擊發射頻率大幅加快！',price:35,apply:()=>player.attackSpeed=Math.max(8,player.attackSpeed-6)},{id:'vampire',title:'吸血牙齒',desc:'擊殺敵人時有 20% 機率回復生命。',price:40,apply:()=>player.vampire+=.2},{id:'maxhp',title:'馬鈴薯外皮',desc:'最大生命值增加 35 點並補滿。',price:30,apply:()=>{player.maxHp+=35;player.hp=player.maxHp}},{id:'regen',title:'再生核心',desc:'每秒自動回復 1.5 點生命值。',price:35,apply:()=>player.hpRegen+=1.5},{id:'armor',title:'鈦金裝甲',desc:'獲得 10% 傷害減免防禦。',price:40,apply:()=>player.armor=Math.min(.75,player.armor+.1)},{id:'crit',title:'精密瞄具',desc:'暴擊率 +10%，暴擊傷害 +25%。',price:45,apply:()=>{player.critChance+=.1;player.critDamage+=.25}}];
const keys={};let touchData={active:false,vx:0,vy:0};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')togglePause()});window.addEventListener('keyup',e=>keys[e.code]=false);
if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch-active');
const controlsLayer=document.getElementById('controlsLayer'),joystickBase=document.getElementById('joystickBase'),joystickThumb=document.getElementById('joystickThumb');let joystickTouchId=null,baseCenterX=0,baseCenterY=0;
controlsLayer.addEventListener('touchstart',e=>{if(joystickTouchId!==null)return;for(let touch of e.changedTouches){joystickTouchId=touch.identifier;baseCenterX=touch.clientX;baseCenterY=touch.clientY;joystickBase.style.left=`${baseCenterX}px`;joystickBase.style.top=`${baseCenterY}px`;joystickBase.style.display='block';joystickThumb.style.transform='translate(0px, 0px)';touchData.active=true;touchData.vx=0;touchData.vy=0;break}},{passive:true});
controlsLayer.addEventListener('touchmove',e=>{if(joystickTouchId===null)return;for(let touch of e.changedTouches){if(touch.identifier===joystickTouchId){let dx=touch.clientX-baseCenterX,dy=touch.clientY-baseCenterY,dist=Math.hypot(dx,dy),maxDist=45;if(dist>maxDist){dx=dx/dist*maxDist;dy=dy/dist*maxDist}joystickThumb.style.transform=`translate(${dx}px, ${dy}px)`;touchData.vx=dx/maxDist;touchData.vy=dy/maxDist;break}}},{passive:true});
function resetJoystick(){joystickTouchId=null;touchData.vx=0;touchData.vy=0;touchData.active=false;joystickBase.style.display='none';joystickThumb.style.transform='translate(0px, 0px)'}
controlsLayer.addEventListener('touchend',e=>{for(let touch of e.changedTouches)if(touch.identifier===joystickTouchId){resetJoystick();break}},{passive:true});controlsLayer.addEventListener('touchcancel',resetJoystick);
function bindButton(id,callback){const el=document.getElementById(id);if(el)el.addEventListener('click',callback)}
bindButton('startBtn',startGame);bindButton('restartBtn',startGame);bindButton('nextWaveBtn',startNextWave);bindButton('pauseBtn',togglePause);bindButton('resumeBtn',togglePause);
function startGame(){initAudio();document.getElementById('startMenu').style.display='none';document.getElementById('gameOverMenu').style.display='none';document.getElementById('shopMenu').style.display='none';document.getElementById('pauseMenu').style.display='none';wave=1;kills=0;player.maxHp=100;player.hp=100;player.hpRegen=0;player.armor=0;player.gold=15;player.speed=4;player.damage=20;player.attackSpeed=32;player.vampire=0;player.critChance=.15;player.critDamage=1.5;initWave()}
function initWave(){player.x=canvas.width/2;player.y=canvas.height/2;enemies=[];bullets=[];materials=[];particles=[];damageNumbers=[];waveTimer=25+wave*5;enemySpawnCounter=0;gameState='PLAYING';if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{if(gameState==='PLAYING'){waveTimer--;if(player.hpRegen>0&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+player.hpRegen);if(waveTimer<=0){clearInterval(timerInterval);triggerShop()}}},1000)}
function togglePause(){if(gameState==='PLAYING'){gameState='PAUSE';updateStatsDisplay();document.getElementById('pauseMenu').style.display='flex'}else if(gameState==='PAUSE'){document.getElementById('pauseMenu').style.display='none';gameState='PLAYING'}}
function updateStatsDisplay(){document.getElementById('statsGrid').innerHTML=`<div class="stat-item"><span class="stat-label">當前生命值:</span><span class="stat-value">${Math.floor(player.hp)} / ${player.maxHp}</span></div><div class="stat-item"><span class="stat-label">生命回復速度:</span><span class="stat-value">+${player.hpRegen.toFixed(1)} / 秒</span></div><div class="stat-item"><span class="stat-label">防禦減傷:</span><span class="stat-value">${(player.armor*100).toFixed(0)}%</span></div><div class="stat-item"><span class="stat-label">移���速度:</span><span class="stat-value">${player.speed.toFixed(1)}</span></div><div class="stat-item"><span class="stat-label">攻擊傷害:</span><span class="stat-value">${player.damage}</span></div><div class="stat-item"><span class="stat-label">攻擊速度:</span><span class="stat-value">${(60/player.attackSpeed).toFixed(1)} 發/秒</span></div><div class="stat-item"><span class="stat-label">暴擊概率:</span><span class="stat-value">${(player.critChance*100).toFixed(0)}%</span></div><div class="stat-item"><span class="stat-label">暴擊傷害:</span><span class="stat-value">${(player.critDamage*100).toFixed(0)}%</span></div>`}
function startNextWave(){wave++;document.getElementById('shopMenu').style.display='none';initWave()}
function spawnParticles(x,y,color,count=6){for(let i=0;i<count;i++){let angle=Math.random()*Math.PI*2,speed=Math.random()*3+1;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,alpha:1,decay:Math.random()*.04+.03,color,radius:Math.random()*3+1})}}
let shootCounter=0;
function update(){if(gameState!=='PLAYING')return;let moveX=0,moveY=0;if(keys.KeyW||keys.ArrowUp)moveY--;if(keys.KeyS||keys.ArrowDown)moveY++;if(keys.KeyA||keys.ArrowLeft)moveX--;if(keys.KeyD||keys.ArrowRight)moveX++;if(touchData.active&&(touchData.vx!==0||touchData.vy!==0)){moveX=touchData.vx;moveY=touchData.vy}if(moveX!==0&&moveY!==0){moveX*=.7071;moveY*=.7071}player.x+=moveX*player.speed;player.y+=moveY*player.speed;player.x=Math.max(player.radius,Math.min(canvas.width-player.radius,player.x));player.y=Math.max(player.radius,Math.min(canvas.height-player.radius,player.y));enemySpawnCounter++;let spawnRate=Math.max(15,45-wave*4);if(enemySpawnCounter>=spawnRate){enemySpawnCounter=0;let angle=Math.random()*Math.PI*2,dist=Math.max(canvas.width,canvas.height)/2+50,ex=player.x+Math.cos(angle)*dist,ey=player.y+Math.sin(angle)*dist,eType=Math.random()<.25?'fast':'normal';enemies.push({x:ex,y:ey,radius:eType==='fast'?12:16,speed:eType==='fast'?2.6+wave*.08:1.6+wave*.06,hp:35+wave*15,maxHp:35+wave*15,damage:12+wave*2,color:eType==='fast'?'#ff3366':'#ff6633'})}shootCounter++;if(shootCounter>=player.attackSpeed){shootCounter=0;let closest=null,minDist=player.range;for(let e of enemies){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<minDist){minDist=d;closest=e}}if(closest){let angle=Math.atan2(closest.y-player.y,closest.x-player.x),isCrit=Math.random()<player.critChance,finalDmg=isCrit?player.damage*player.critDamage:player.damage;bullets.push({x:player.x,y:player.y,vx:Math.cos(angle)*11,vy:Math.sin(angle)*11,damage:finalDmg,isCrit});playSound('shoot')}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx;b.y+=b.vy;let hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.radius+4){e.hp-=b.damage;damageNumbers.push({x:e.x,y:e.y-e.radius-8,value:Math.round(b.damage),isCrit:b.isCrit,life:1,vy:b.isCrit?-1.35:-1});spawnParticles(e.x,e.y,b.isCrit?'#ff3366':'#ffcc00',b.isCrit?6:3);hit=true;if(e.hp<=0){kills++;spawnParticles(e.x,e.y,'#ff3366',15);materials.push({x:e.x,y:e.y,value:3+wave});if(player.vampire>0&&Math.random()<player.vampire)player.hp=Math.min(player.maxHp,player.hp+6);enemies.splice(j,1)}break}}if(hit||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height)bullets.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],angle=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(angle)*e.speed;e.y+=Math.sin(angle)*e.speed;if(Math.hypot(player.x-e.x,player.y-e.y)<player.radius+e.radius){player.hp-=e.damage*(1-player.armor)*.05;playSound('hit');if(player.hp<=0)gameOver()}}
for(let i=materials.length-1;i>=0;i--){let m=materials[i],dist=Math.hypot(player.x-m.x,player.y-m.y);if(dist<85){let angle=Math.atan2(player.y-m.y,player.x-m.x);m.x+=Math.cos(angle)*6;m.y+=Math.sin(angle)*6;if(dist<player.radius+10){player.gold+=m.value;playSound('coin');materials.splice(i,1)}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;if(p.alpha<=0)particles.splice(i,1)}for(let i=damageNumbers.length-1;i>=0;i--){let n=damageNumbers[i];n.y+=n.vy;n.life-=.025;if(n.life<=0)damageNumbers.splice(i,1)}updateHUD()}
function updateHUD(){document.getElementById('hud-wave').innerText=wave;document.getElementById('hud-hp').innerText=`${Math.max(0,Math.floor(player.hp))}/${player.maxHp}`;document.getElementById('hud-gold').innerText=player.gold;document.getElementById('hud-time').innerText=`${waveTimer}s`}
function triggerShop(){initAudio();gameState='SHOP';let grid=document.getElementById('shopGrid');grid.innerHTML='';[...itemPool].sort(()=>.5-Math.random()).slice(0,4).forEach(item=>{let card=document.createElement('div');card.className='shop-card';card.innerHTML=`<div class="shop-card-title">${item.title}</div><div class="shop-card-desc">${item.desc}</div><div class="shop-card-price">價格: $${item.price}</div>`;card.addEventListener('click',()=>{if(player.gold>=item.price){player.gold-=item.price;item.apply();card.style.opacity='.4';card.style.pointerEvents='none';playSound('coin')}});grid.appendChild(card)});document.getElementById('shopMenu').style.display='flex'}
function gameOver(){gameState='GAMEOVER';if(timerInterval)clearInterval(timerInterval);document.getElementById('gameOverStats').innerText=`撐到了第 ${wave} 波 | 總擊殺數: ${kills}`;document.getElementById('gameOverMenu').style.display='flex'}
function drawEnemyHealthBar(e){const width=Math.max(26,e.radius*2.4),height=5,x=e.x-width/2,y=e.y-e.radius-10,ratio=Math.max(0,Math.min(1,e.hp/e.maxHp));ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(x-1,y-1,width+2,height+2);ctx.fillStyle='#55202b';ctx.fillRect(x,y,width,height);ctx.fillStyle=ratio>.5?'#35e06f':ratio>.25?'#ffcc00':'#ff4455';ctx.fillRect(x,y,width*ratio,height)}
function drawDamageNumbers(){damageNumbers.forEach(n=>{ctx.save();ctx.globalAlpha=Math.max(0,n.life);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${n.isCrit?'bold 20px':'bold 14px'} Arial, sans-serif`;ctx.lineWidth=n.isCrit?4:3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.fillStyle=n.isCrit?'#ff334d':'#ffffff';const label=`${n.isCrit?'✦ ':''}${n.value}`;ctx.strokeText(label,n.x,n.y);ctx.fillText(label,n.x,n.y);ctx.restore()})}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255, 255, 255, 0.03)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}materials.forEach(m=>{ctx.fillStyle='#00ffcc';ctx.beginPath();ctx.arc(m.x,m.y,5,0,Math.PI*2);ctx.fill()});particles.forEach(p=>{ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();ctx.restore()});bullets.forEach(b=>{ctx.fillStyle=b.isCrit?'#ff3366':'#ffcc00';ctx.beginPath();ctx.arc(b.x,b.y,b.isCrit?6:4,0,Math.PI*2);ctx.fill()});enemies.forEach(e=>{ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();drawEnemyHealthBar(e)});drawDamageNumbers();if(['PLAYING','PAUSE','SHOP'].includes(gameState)){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#d4883b';ctx.beginPath();ctx.ellipse(0,0,player.radius,player.radius*1.2,0,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#5a3818';ctx.stroke();ctx.fillStyle='#101218';ctx.beginPath();ctx.arc(-5,-3,2.5,0,Math.PI*2);ctx.arc(5,-3,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
