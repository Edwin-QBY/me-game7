<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>馬鈴薯深空戰記 (Space Spud: Arena)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1c23;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}canvas{display:block;width:100%;height:100%;background:radial-gradient(circle at center,#252836,#101218)}#ui-layer{position:absolute;inset:0;padding:14px;pointer-events:none;z-index:20}.hud-top{display:flex;justify-content:space-between;align-items:flex-start}.hud-panel{display:flex;gap:14px;background:rgba(20,25,35,.75);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px);font-size:13px}.hud-panel span{color:#ffda7a;font-weight:700}.btn-pause{pointer-events:auto;background:#f0f4ff;border:none;border-radius:8px;padding:8px 12px;color:#101218;font-weight:700;cursor:pointer}.controls-layer{position:absolute;inset:0;display:none;z-index:10;touch-action:none}.touch-active .controls-layer{display:block}.stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.12);pointer-events:none;display:none}.stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border:2px solid #fff;border-radius:50%;background:#fffb}.modal-overlay{position:absolute;inset:0;z-index:100;background:rgba(10,16,24,.72);backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;overflow:auto;text-align:center}.modal-overlay[style*="display: none"]{display:none!important}.modal-title{font-size:27px;color:#fff;font-weight:800;text-shadow:0 0 18px rgba(255,255,255,.15);margin:5px 0}.modal-subtitle{font-size:13px;color:#b0b5c0;margin:6px 0 16px}.menu-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.btn-menu{border:0;border-radius:8px;padding:12px 22px;margin:5px;min-width:170px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#f9b146,#ff6a00);color:#101218}.btn-menu.secondary{background:#202838;color:#fff;border:1px solid rgba(255,255,255,.15)}.choice-grid,.weapon-grid,.shop-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(940px,96vw);margin:6px auto 12px}.choice-card,.weapon-card,.shop-card{width:195px;max-width:45vw;padding:12px;border:2px solid rgba(255,255,255,.08);border-radius:10px;background:#191e2a;color:#fff;cursor:pointer;line-height:1.4}.choice-card.selected,.weapon-card.selected{border-color:#0fc;box-shadow:0 0 14px rgba(0,255,204,.35)}.choice-card strong,.weapon-card strong,.shop-card strong{display:block;color:#fff;margin-bottom:5px}.choice-card small,.weapon-card small,.shop-card small{color:#c1c6d0;display:block}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;width:min(420px,90vw);padding:11px 14px;margin:4px 0;background:#191e2a;border:1px solid rgba(255,255,255,.07);border-radius:8px}.setting input[type=range]{width:145px}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:7px;width:min(580px,95vw);padding:13px;margin:8px auto;background:#141923;border:1px solid rgba(255,255,255,.08);border-radius:10px}.stat-item{display:flex;justify-content:space-between;gap:7px;border-bottom:1px solid rgba(255,255,255,.08);padding:5px 0;font-size:12px}.stat-item span:first-child{color:#b0b5c0}.stat-item span:last-child{color:#fff;font-weight:700}.boss-hud{position:absolute;top:104px;left:0;width:100%;text-align:center;pointer-events:none}.@media(max-width:600px){.hud-panel{font-size:11px;padding:6px 8px}.choice-card,.weapon-card,.shop-card{font-size:11px;padding:8px}.stats-grid{grid-template-columns:1fr}.shop-card{width:44%}}</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
  <div class="hud-top">
    <div class="hud-panel player-stats">
      <div>波次 (Wave): <span id="hud-wave">1</span></div>
      <div>生命值 (HP): <span id="hud-hp">100/100</span></div>
      <div>金幣: <span id="hud-gold">15</span></div>
      <div>時間: <span id="hud-timer">30s</span></div>
    </div>
    <button class="btn-pause" id="pauseBtn">⏸</button>
  </div>
</div>
<div class="controls-layer" id="controlsLayer">
  <div class="stick" id="joystickBase"><i id="joystickThumb"></i></div>
</div>
<div class="modal-overlay" id="startMenu">
  <div class="modal-title">馬鈴薯深空戰記</div>
  <div class="modal-subtitle">SPACE SPUD: ARENA SURVIVAL</div>
  <div class="menu-buttons">
    <button class="btn-menu" id="newGameBtn">開始戰鬥</button>
    <button class="btn-menu secondary" id="continueGameBtn" hidden>繼續戰鬥</button>
    <button class="btn-menu secondary" id="openSettingsBtn">設定</button>
  </div>
</div>
<div class="modal-overlay" id="loadoutMenu" style="display:none">
  <div class="modal-title">選擇你的戰鬥配置</div>
  <div class="modal-subtitle">選擇職業與武器後進入戰鬥</div>
  <strong>職業</strong>
  <div class="choice-grid" id="classChoices"></div>
  <strong>武器</strong>
  <div class="weapon-grid" id="weaponChoices"></div>
  <div class="menu-buttons" style="margin-top:10px">
    <button class="btn-menu" id="beginBattleBtn">開始戰鬥</button>
    <button class="btn-menu secondary" id="loadoutBackBtn">返回</button>
  </div>
</div>
<div class="modal-overlay" id="settingsMenu" style="display:none">
  <div class="modal-title">遊戲設定</div>
  <div class="modal-subtitle">設定會自動儲存在此瀏覽器</div>
  <label class="setting"><span>音效開關</span><input type="checkbox" id="soundToggle"></label>
  <label class="setting"><span>音量</span><input type="range" id="volumeSlider" min="0" max="100"><span id="volumeText">65%</span></label>
  <label class="setting"><span>特效強度</span><input type="range" id="fxSlider" min="25" max="150"><span id="fxText">100%</span></label>
  <div class="menu-buttons" style="margin-top:10px">
    <button class="btn-menu secondary" id="settingsBackBtn">返回</button>
  </div>
</div>
<div class="modal-overlay" id="pauseMenu" style="display:none">
  <div class="modal-title">遊戲暫停</div>
  <div class="modal-subtitle">當前角色數值</div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="menu-buttons">
    <button class="btn-menu" id="resumeBtn">返回戰鬥</button>
    <button class="btn-menu secondary" id="saveExitBtn">離開</button>
  </div>
</div>
<div class="modal-overlay" id="shopMenu" style="display:none">
  <div class="modal-title">戰利品商店 (SHOP)</div>
  <div class="modal-subtitle">購買道具強化你的馬鈴薯！</div>
  <div class="shop-grid" id="shopGrid"></div>
  <button class="btn-menu" id="nextWaveBtn">下一波</button>
</div>
<div class="modal-overlay" id="gameOverMenu" style="display:none">
  <div class="modal-title" style="color:#ff3366">馬鈴薯倒下了 (GAME OVER)</div>
  <div class="modal-subtitle" id="gameOverStats"></div>
  <button class="btn-menu" id="restartBtn">重新開始</button>
</div>
<script>
'use strict';
const SAVE_KEY='spaceSpudArenaSaveV1';
const SETTINGS_KEY='spaceSpudSettingsV1';
const classes=[
  {id:'berserker',name:'狂戰士',desc:'近戰武器傷害 +35%，暴擊傷害 +35%。',melee:1.35,range:1,crit:0.35,summon:1},
  {id:'archer',name:'弓箭手',desc:'遠程傷害 +25%，射程 +25%。',melee:1,range:1.25,crit:0.1,summon:1},
  {id:'summoner',name:'召喚師',desc:'召喚與魔法傷害 +80%，遠程魔彈額外攻擊。',melee:1,range:1,summon:1.8,crit:0.08}
];
const weapons=[
  {id:'knife',name:'刀',desc:'短距離、高頻率。',damage:1.25,range:110,cooldown:24,speed:14,kind:'melee',projectile:4,shape:'slash'},
  {id:'sword',name:'劍',desc:'近中距離，均衡輸出。',damage:1.15,range:150,cooldown:30,speed:13,kind:'melee',projectile:5,shape:'slash'},
  {id:'halberd',name:'長戟',desc:'長距離斬擊，打擊範圍大。',damage:1.55,range:200,cooldown:48,speed:12,kind:'melee',projectile:6,shape:'slash'},
  {id:'bow',name:'弓',desc:'快速箭矢。',damage:1.05,range:320,cooldown:38,speed:16,kind:'ranged',projectile:4,shape:'arrow'},
  {id:'crossbow',name:'十字弩',desc:'高傷害穿透。',damage:1.65,range:290,cooldown:55,speed:18,kind:'ranged',projectile:5,shape:'bolt'},
  {id:'cannon',name:'炮',desc:'重型砲彈，爆炸彈。',damage:2.1,range:300,cooldown:72,speed:11,kind:'ranged',projectile:8,shape:'orb',splash:45}
];
const settings={sound:true,volume:0.65,effects:1};
try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch(e){}
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let audioCtx=null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function playSound(type){
  if(!settings.sound||settings.volume<=0) return;
  initAudio();
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    const now=audioCtx.currentTime;
    o.connect(g); g.connect(audioCtx.destination);
    o.type=type==='hit'?'sawtooth':'triangle';
    o.frequency.setValueAtTime(type==='hit'?180:type==='coin'?780:420,now);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(0.08*settings.volume, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
    o.start(now); o.stop(now + 0.09);
  }catch(e){}
}
function resizeCanvas(){canvas.width=innerWidth; canvas.height=innerHeight;} addEventListener('resize', resizeCanvas); resizeCanvas();

let gameState='START', wave=1, waveTimer=25, timerInterval=null, kills=0, shootCounter=0, enemySpawnCounter=0, shopChoiceIds=[], purchasedItemIds=[], classId='archer', weaponId='bow', summonCounter=0;
let player={x:canvas.width/2,y:canvas.height/2,radius:18,speed:4,maxHp:100,hp:100,hpRegen:0,armor:0,gold:15,attackSpeed:32,damage:20,range:240,vampire:0,critChance:0.15,critDamage:1.5,dodgeChance:0,attractionRange:120,summonDamage:16};
let enemies=[], bullets=[], materials=[], particles=[], damageNumbers=[], slashes=[];
const keys={};
const touchData={active:false,vx:0,vy:0};

function showMenu(id){
  document.querySelectorAll('.modal-overlay').forEach(el=>el.style.display='none');
  const el=document.getElementById(id); if(el) el.style.display='flex';
}
function renderChoices(){
  document.getElementById('classChoices').innerHTML = classes.map(c => `
    <button class="choice-card ${classId===c.id?'selected':''}" data-job="${c.id}">
      <strong>${c.name}</strong>
      <small>${c.desc}</small>
    </button>
  `).join('');
  document.getElementById('weaponChoices').innerHTML = weapons.map(w => `
    <button class="weapon-card ${weaponId===w.id?'selected':''}" data-weapon="${w.id}">
      <strong>${w.name}</strong>
      <small>${w.desc}<br>傷害 x${w.damage} · 射程 ${w.range} · 攻速 ${w.cooldown}</small>
    </button>
  `).join('');

  document.querySelectorAll('[data-job]').forEach(btn=>{
    btn.onclick=()=>{ classId=btn.dataset.job; renderChoices(); };
  });
  document.querySelectorAll('[data-weapon]').forEach(btn=>{
    btn.onclick=()=>{ weaponId=btn.dataset.weapon; renderChoices(); };
  });
}

const itemPool=[
  {id:'gun',title:'強化彈藥',desc:'攻擊傷害提升 8 點。',price:30,apply:()=>player.damage+=8},
  {id:'speed',title:'跑鞋',desc:'移動速度提升 20%。',price:25,apply:()=>player.speed*=1.2},
  {id:'attack',title:'快速連射',desc:'攻速提升 10%。',price:35,apply:()=>player.attackSpeed*=0.9},
  {id:'vampire',title:'吸血之刃',desc:'生命回復 +0.2/擊。',price:40,apply:()=>player.vampire+=0.2},
  {id:'maxhp',title:'護甲補給',desc:'最大生命 +35。',price:30,apply:()=>{player.maxHp+=35;player.hp+=35;}},
  {id:'regen',title:'修復藥劑',desc:'每秒回復 1.5 血。',price:35,apply:()=>player.hpRegen+=1.5},
  {id:'armor',title:'護盾模組',desc:'護甲 +10%。',price:45,apply:()=>player.armor+=0.1},
  {id:'crit',title:'會心瞄準器',desc:'暴擊率 +10%。',price:45,apply:()=>player.critChance+=0.1},
  {id:'magnet',title:'磁力腰帶',desc:'吸取範圍 +20。',price:35,apply:()=>player.attractionRange+=20},
  {id:'summon',title:'元素契約',desc:'召喚傷害 +35%。',price:50,apply:()=>player.summonDamage*=1.35}
];
function clamp(v,min,max){return Math.min(max,Math.max(min,v));}
function nearestEnemy(x,y,range){
  let target=null; let best=range;
  for(const e of enemies){
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<best){best=d; target=e;}
  }
  return target;
}
function spawnParticles(x,y,color,count=6,spread=1){
  const scale=Math.max(0.25,settings.effects);
  for(let i=0;i<Math.round(count*scale);i++){
    const a=Math.random()*Math.PI*2;
    const speed=(Math.random()*3+1)*span(spread);
    particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1,color, radius:Math.random()*3+1, decay:0.015 + Math.random()*0.025});
  }
}
function spawnParticles(x,y,color,count=6,spread=1){
  const scale=Math.max(0.25,settings.effects);
  for(let i=0;i<Math.round(count*scale);i++){
    const a=Math.random()*Math.PI*2;
    const speed=(Math.random()*3+1)*spread*scale;
    particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1,color, radius:Math.random()*3+1, decay:0.015 + Math.random()*0.025});
  }
}
function addDamageNumber(x,y,text,color='#fff',critical=false){
  damageNumbers.push({x,y,text,life:1,vy:-1.2, color, critical, grow:1.1});
}
function addSlash(x,y,angle,length,ttl=0.16,color='#fff',width=14){
  slashes.push({x,y,angle,length,ttl,life:ttl,color,width});
}
function makeEnemy(type,x,y){
  const boss=type==='boss';
  const elite=type==='elite';
  const hp=boss ? 1800 + wave*260 : elite ? 260 + wave*85 : 35 + wave*18;
  const radius=boss ? 36 : elite ? 25 : (Math.random()<.25?12:16);
  const speed = boss ? 0.8 : elite ? 1.15 : (Math.random()<0.18?2.4:1.6) + wave*0.05;
  return {x,y,type,radius,hp,maxHp:hp,speed,color:boss ? '#c86bff' : elite ? '#ff9d42' : '#ff3366', damage: boss ? 26 : elite ? 18 : 8 + wave*0.4, cooldown:0};
}
function spawnEnemy(type='normal'){
  const a=Math.random()*Math.PI*2;
  const d=Math.max(canvas.width,canvas.height)/2 + 70;
  enemies.push(makeEnemy(type, player.x + Math.cos(a)*d, player.y + Math.sin(a)*d));
}
function initWave(){
  player.x=canvas.width/2; player.y=canvas.height/2;
  enemies=[]; bullets=[]; materials=[]; particles=[]; damageNumbers=[]; slashes=[];
  waveTimer=25+wave*5; enemySpawnCounter=0; gameState='PLAYING';
  if(wave%5===0) spawnEnemy('boss');
  else if(wave%3===0) spawnEnemy('elite');
  startTimer();
  saveGame();
}
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(gameState!=='PLAYING') return;
    waveTimer--;
    if(player.hpRegen>0 && player.hp < player.maxHp) player.hp=Math.min(player.maxHp, player.hp + player.hpRegen);
    if(waveTimer<=0){
      clearInterval(timerInterval);
      triggerShop();
    }
  },1000);
}
function startGame(){
  initAudio();
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  wave=1; kills=0; shootCounter=0; enemySpawnCounter=0; summonCounter=0;
  player={x:canvas.width/2,y:canvas.height/2,radius:18,speed:4,maxHp:100,hp:100,hpRegen:0,armor:0,gold:15,attackSpeed:32,damage:20,range:240,vampire:0,critChance:0.15,critDamage:1.5,dodgeChance:0,attractionRange:120,summonDamage:16};
  enemies=[]; bullets=[]; materials=[]; particles=[]; damageNumbers=[]; slashes=[];
  initWave();
  showMenu('none');
  updateStatsDisplay();
  updateHUD();
}
function triggerShop(){
  initAudio();
  gameState='SHOP';
  shopChoiceIds=[...itemPool].sort(()=>Math.random()-.5).slice(0,4).map(item=>item.id);
  purchasedItemIds=[];
  renderShop();
  document.getElementById('shopMenu').style.display='flex';
  saveGame();
}
function renderShop(){
  const grid=document.getElementById('shopGrid');
  grid.innerHTML='';
  for(const id of shopChoiceIds){
    const item=itemPool.find(x=>x.id===id);
    if(!item) continue;
    const card=document.createElement('button');
    card.className='shop-card';
    card.innerHTML=`<strong>${item.title}</strong><small>${item.desc}</small><br><em>價格: ${item.price}</em>`;
    card.disabled = player.gold < item.price || purchasedItemIds.includes(id);
    card.onclick=()=>{
      if(player.gold < item.price || purchasedItemIds.includes(id)) return;
      player.gold -= item.price;
      item.apply();
      purchasedItemIds.push(id);
      renderShop();
      updateHUD();
      updateStatsDisplay();
      saveGame();
    };
    grid.appendChild(card);
  }
}
function startNextWave(){
  wave++;
  document.getElementById('shopMenu').style.display='none';
  initWave();
}
function gameOver(){
  gameState='GAMEOVER';
  if(timerInterval) clearInterval(timerInterval);
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  document.getElementById('gameOverStats').textContent=`撐到了第 ${wave} 波｜擊殺 ${kills} 隻敵人｜金幣 ${player.gold}`;
  document.getElementById('gameOverMenu').style.display='flex';
}
function updateHUD(){
  document.getElementById('hud-wave').textContent=wave;
  document.getElementById('hud-hp').textContent=`${Math.max(0,Math.floor(player.hp))}/${player.maxHp}`;
  document.getElementById('hud-gold').textContent=player.gold;
  document.getElementById('hud-timer').textContent=`${Math.max(0,waveTimer)}s`;
}
function updateStatsDisplay(){
  const c=classes.find(x=>x.id===classId)||classes[1];
  const w=weapons.find(x=>x.id===weaponId)||weapons[3];
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-item"><span>職業</span><span>${c.name}</span></div>
    <div class="stat-item"><span>武器</span><span>${w.name}</span></div>
    <div class="stat-item"><span>HP</span><span>${Math.floor(player.hp)} / ${player.maxHp}</span></div>
    <div class="stat-item"><span>護甲</span><span>${(player.armor*100).toFixed(0)}%</span></div>
    <div class="stat-item"><span>攻速</span><span>${(60 / (player.attackSpeed * w.cooldown / 32)).toFixed(1)}/s</span></div>
    <div class="stat-item"><span>暴擊</span><span>${(player.critChance*100).toFixed(0)}%</span></div>
    <div class="stat-item"><span>回復</span><span>${player.hpRegen.toFixed(1)}</span></div>
    <div class="stat-item"><span>吸引</span><span>${player.attractionRange}</span></div>
  `;
}
function togglePause(){
  if(gameState==='PLAYING'){
    gameState='PAUSE';
    updateStatsDisplay();
    document.getElementById('pauseMenu').style.display='flex';
    saveGame();
  }else if(gameState==='PAUSE'){
    gameState='PLAYING';
    document.getElementById('pauseMenu').style.display='none';
    startTimer();
    saveGame();
  }
}
function saveGame(){
  if(!['PLAYING','PAUSE','SHOP'].includes(gameState)) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      version:2, gameState, wave, waveTimer, kills, player, enemies, bullets, materials, particles, damageNumbers, slashes, classId, weaponId, shopChoiceIds, purchasedItemIds
    }));
  }catch(e){}
}
function hasSave(){
  try{return !!localStorage.getItem(SAVE_KEY)}catch(e){return false;}
}
function loadSavedGame(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s||s.version!==2) throw new Error('invalid save');
    wave=s.wave; waveTimer=s.waveTimer; kills=s.kills; classId=s.classId||'archer'; weaponId=s.weaponId||'bow';
    player={...player, ...s.player};
    enemies=s.enemies||[]; bullets=s.bullets||[]; materials=s.materials||[]; particles=s.particles||[]; damageNumbers=s.damageNumbers||[]; slashes=s.slashes||[];
    shopChoiceIds=s.shopChoiceIds||[]; purchasedItemIds=s.purchasedItemIds||[];
    if(s.gameState==='SHOP'){ gameState='SHOP'; document.getElementById('shopMenu').style.display='flex'; renderShop(); }
    else if(s.gameState==='PAUSE'){ gameState='PAUSE'; document.getElementById('pauseMenu').style.display='flex'; }
    else { gameState='PLAYING'; }
    updateHUD();
    updateStatsDisplay();
  }catch(e){
    try{localStorage.removeItem(SAVE_KEY)}catch(_e){}
  }
}
function drawBar(e){
  const w=e.type==='boss'?Math.max(48,e.radius*2.4):Math.max(26,e.radius*2.4), h=e.type==='boss'?8:5;
  const x=e.x-w/2; const y=e.y-e.radius-10; const r=Math.max(0,Math.min(1,e.hp/e.maxHp));
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=e.type==='boss'?'#c86bff':r>.6?'#32d59d':'#ffcd58';
  ctx.fillRect(x,y,w*r,h);
}
function drawBullet(b){
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(Math.atan2(b.vy,b.vx));
  ctx.fillStyle=b.color || '#fff';
  if(b.shape==='arrow'){
    ctx.beginPath(); ctx.moveTo(b.radius+6,0); ctx.lineTo(-b.radius-6,-b.radius*0.8); ctx.lineTo(-b.radius-6,b.radius*0.8); ctx.closePath(); ctx.fill();
  }else if(b.shape==='bolt'){
    ctx.fillRect(-b.radius-7,-b.radius*0.7, b.radius*2+14, b.radius*1.4);
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.strokeRect(-b.radius-7,-b.radius*0.7, b.radius*2+14, b.radius*1.4);
  }else if(b.shape==='orb'){
    ctx.beginPath(); ctx.arc(0,0,b.radius+2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillRect(-b.radius, -2, b.radius*2, 4);
  }else{
    ctx.beginPath(); ctx.arc(0,0,b.radius+1,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawSlash(s){
  ctx.save();
  const alpha=Math.max(0, Math.min(1, s.life / s.ttl));
  ctx.translate(s.x,s.y);
  ctx.rotate(s.angle);
  ctx.strokeStyle=`rgba(255,255,255,${0.88*alpha})`;
  ctx.shadowBlur=18; ctx.shadowColor='rgba(255,255,255,.9)';
  ctx.lineWidth=s.width;
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(s.length,0); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(s.length*0.68, s.width*0.2); ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
  for(let x=0; x<canvas.width; x+=50){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0; y<canvas.height; y+=50){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
  for(const s of slashes){ drawSlash(s); }
  for(const b of bullets){ drawBullet(b); }
  for(const e of enemies){
    ctx.fillStyle=e.color; ctx.beginPath(); ctx.arc(e.x,e.y,e.radius,0,Math.PI*2); ctx.fill();
    drawBar(e);
  }
  for(const m of materials){
    ctx.fillStyle='#0fc'; ctx.beginPath(); ctx.arc(m.x,m.y,5,0,Math.PI*2); ctx.fill();
  }
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,p.radius),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  for(const d of damageNumbers){
    ctx.globalAlpha=Math.max(0,d.life);
    ctx.fillStyle=d.color || '#fff';
    ctx.font=`bold ${d.critical ? 18 : 14}px Arial`;
    ctx.textAlign='center';
    ctx.fillText(d.text,d.x,d.y); ctx.globalAlpha=1;
  }
  for(const c of materials){
    if(!c.value) continue;
  }
  // player ring
  ctx.beginPath(); ctx.arc(player.x,player.y,player.radius+4,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(player.x,player.y,player.radius,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  // boss HUD
  const boss=enemies.find(e=>e.type==='boss');
  if(boss){
    const w=Math.min(canvas.width-40,900), h=14, x=(canvas.width-w)/2, y=110;
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#ff5fd2'; ctx.fillRect(x,y,w*(boss.hp/boss.maxHp),h);
    ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.fillText('BOSS', canvas.width/2, y-12);
  }
}
function damagePlayer(amount,sourceX=player.x,sourceY=player.y){
  if(Math.random()<player.dodgeChance){
    addDamageNumber(player.x,player.y-28,'閃避','#7af0ff',false);
    return;
  }
  const actual = Math.max(1, amount * (1 - player.armor));
  player.hp -= actual;
  spawnParticles(player.x,player.y,'#ff334d',10,1.1);
  if(player.hp <= 0) gameOver();
}
function update(){
  if(gameState!=='PLAYING')return;
  let mx=0,my=0;
  if(keys.KeyW||keys.ArrowUp) my--; if(keys.KeyS||keys.ArrowDown) my++; if(keys.KeyA||keys.ArrowLeft) mx--; if(keys.KeyD||keys.ArrowRight) mx++; 
  if(touchData.active){ mx=touchData.vx; my=touchData.vy; }
  if(mx || my){
    const len=Math.hypot(mx,my) || 1;
    const px=(mx/len)*player.speed; const py=(my/len)*player.speed;
    player.x = clamp(player.x + px, player.radius, canvas.width - player.radius);
    player.y = clamp(player.y + py, player.radius, canvas.height - player.radius);
  }
  // spawns
  if(wave%5!==0 && ++enemySpawnCounter>=Math.max(32,120-wave*5)){
    enemySpawnCounter=0;
    const batch=Math.min(7,1+Math.floor((wave-1)/3));
    for(let n=0;n<batch;n++) spawnEnemy(Math.random()<Math.min(0.4,0.2 + wave*0.005) ? 'fast' : 'normal');
  }

  const weapon=weapons.find(w=>w.id===weaponId)||weapons[3];
  const job=classes.find(c=>c.id===classId)||classes[1];
  const baseInterval=Math.max(7, Math.round(player.attackSpeed * weapon.cooldown / 32));
  if(++shootCounter >= baseInterval){
    shootCounter=0;
    const target=nearestEnemy(player.x,player.y, weapon.range + 220);
    const aimX=target?target.x:player.x + (mx || 0)*90;
    const aimY=target?target.y:player.y + (my || 0)*90;
    const angle=Math.atan2(aimY-player.y, aimX-player.x);

    if(weapon.kind==='melee'){
      addSlash(player.x,player.y,angle, weapon.range + 30,0.12, '#fff', weapon.id==='halberd'?18:weapon.id==='sword'?15:12);
      const hits=enemies.filter(e=>{
        const dx=e.x-player.x, dy=e.y-player.y;
        const dist=Math.hypot(dx,dy); if(dist>weapon.range + e.radius + 18) return false;
        const a=Math.atan2(dy,dx); const diff=Math.abs(Math.atan2(Math.sin(a-angle),Math.cos(a-angle)));
        return diff < 1.2;
      }).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));
      const maxHits=weapon.id==='halberd'?4: weapon.id==='sword'?3:2;
      for(let i=0;i<Math.min(maxHits,hits.length);i++){
        const e=hits[i];
        const dmg = (player.damage * weapon.damage) * (job.melee || 1) * (1 + (e.type==='boss'?0.1:0));
        const crit = Math.random() < player.critChance || Math.random() < (job.crit||0);
        const finalDamage = dmg * (crit ? player.critDamage : 1);
        e.hp -= finalDamage;
        addDamageNumber(e.x, e.y - e.radius, `${Math.round(finalDamage)}`, crit ? '#ffd66b' : '#fff', crit);
        spawnParticles(e.x, e.y, '#fff', 4, 0.8);
        if(e.type==='boss' || e.type==='elite'){ e.cooldown = 12; }
      }
      playSound('hit');
    } else {
      const speed = weapon.speed || 12;
      const bulletDamage = player.damage * weapon.damage * (job.range || 1);
      bullets.push({
        x:player.x,
        y:player.y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        damage: bulletDamage,
        radius: weapon.projectile || 4,
        color: weapon.id==='crossbow' ? '#ffb84d' : weapon.id==='cannon' ? '#ff734d' : '#7bdff2',
        shape: weapon.shape,
        crit: Math.random() < player.critChance || Math.random() < (job.crit||0),
        life: 120,
        splash: weapon.splash || 0,
        from: 'player'
      });
      playSound('coin');
    }
  }

  // bullets update
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      const dist=Math.hypot(b.x-e.x, b.y-e.y);
      if(dist < e.radius + (b.radius||4)){
        hit=true;
        const dmg = b.damage * (b.crit ? player.critDamage : 1);
        e.hp -= dmg;
        addDamageNumber(e.x, e.y - e.radius, `${Math.round(dmg)}`, b.crit ? '#ffd66b' : '#fff', b.crit);
        spawnParticles(e.x, e.y, b.color, b.splash ? 10 : 6, 1.2);
        if(b.splash>0){
          for(const other of enemies){
            if(other===e) continue;
            const d=Math.hypot(other.x-e.x, other.y-e.y);
            if(d < b.splash){
              const splashDamage = dmg * 0.45;
              other.hp -= splashDamage;
              addDamageNumber(other.x, other.y - other.radius, `${Math.round(splashDamage)}`, '#ffbd59', false);
            }
          }
        }
        break;
      }
    }
    if(hit || b.life <= 0 || b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50){
      bullets.splice(i,1);
    }
  }

  // slashes life
  for(let i=slashes.length-1;i>=0;i--){
    slashes[i].life -= 0.016;
    if(slashes[i].life <= 0) slashes.splice(i,1);
  }

  // enemies move and attack
  for(let i=enemies.length-1; i>=0; i--){
    const e=enemies[i];
    const dx=player.x-e.x; const dy=player.y-e.y; const dist=Math.hypot(dx,dy) || 1;
    const nx=dx/dist; const ny=dy/dist;
    e.x += nx * (e.speed || 1);
    e.y += ny * (e.speed || 1);
    if(dist < e.radius + player.radius + 2){
      damagePlayer(e.damage, e.x, e.y);
    }
    if(e.hp <= 0){
      kills++; player.gold += e.type==='boss' ? 18 : e.type==='elite' ? 8 : 3;
      spawnParticles(e.x, e.y, e.color, e.type==='boss' ? 35 : 15, 1.6);
      materials.push({x:e.x,y:e.y,value:Math.max(1, Math.round((e.type==='boss'?25: e.type==='elite'?8:3) * (1 + wave*0.08))) });
      enemies.splice(i,1);
    }
  }

  for(let i=materials.length-1;i>=0;i--){
    const m=materials[i];
    const dist=Math.hypot(player.x-m.x, player.y-m.y);
    if(dist < player.attractionRange){
      const angle=Math.atan2(player.y-m.y, player.x-m.x);
      const pull=Math.min(9, 4 + (player.attractionRange - dist) * 0.05);
      m.x += Math.cos(angle) * pull;
      m.y += Math.sin(angle) * pull;
      if(dist < player.radius + 10){
        player.gold += m.value;
        materials.splice(i,1);
      }
    }
  }

  for(const p of particles){
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
  }
  for(let i=particles.length-1;i>=0;i--){
    if(particles[i].life <= 0) particles.splice(i,1);
  }
  for(let i=damageNumbers.length-1;i>=0;i--){
    const d=damageNumbers[i];
    d.y += d.vy; d.life -= 0.02; if(d.life <=0) damageNumbers.splice(i,1);
  }

  if(player.hp > 0 && waveTimer <= 0 && enemies.length===0 && document.getElementById('shopMenu').style.display !== 'flex'){
    triggerShop();
  }

  updateHUD();
  updateStatsDisplay();
}
function bind(id, fn){ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); }
bind('newGameBtn',()=>{renderChoices(); showMenu('loadoutMenu');});
bind('beginBattleBtn',()=>{ if(!classes.some(c=>c.id===classId) || !weapons.some(w=>w.id===weaponId)) return; startGame(); });
bind('loadoutBackBtn',()=>showMenu('startMenu'));
bind('openSettingsBtn',()=>{syncSettings(); showMenu('settingsMenu');});
bind('settingsBackBtn',()=>showMenu('startMenu'));
bind('pauseBtn',togglePause);
bind('resumeBtn',togglePause);
bind('saveExitBtn',()=>{saveGame(); if(timerInterval) clearInterval(timerInterval); gameState='START'; showMenu('startMenu');});
bind('nextWaveBtn',startNextWave);
bind('restartBtn',()=>{document.getElementById('gameOverMenu').style.display='none'; startGame();});
function syncSettings(){
  document.getElementById('soundToggle').checked = settings.sound;
  document.getElementById('volumeSlider').value = Math.round(settings.volume*100);
  document.getElementById('volumeText').textContent = `${Math.round(settings.volume*100)}%`;
  document.getElementById('fxSlider').value = Math.round(settings.effects*100);
  document.getElementById('fxText').textContent = `${Math.round(settings.effects*100)}%`;
}
function storeSettings(){
  try{localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));}catch(e){}
}
document.getElementById('soundToggle').onchange=(e)=>{ settings.sound=e.target.checked; storeSettings(); };
document.getElementById('volumeSlider').oninput=(e)=>{ settings.volume = Number(e.target.value)/100; document.getElementById('volumeText').textContent = `${e.target.value}%`; storeSettings(); };
document.getElementById('fxSlider').oninput=(e)=>{ settings.effects = Number(e.target.value)/100; document.getElementById('fxText').textContent = `${e.target.value}%`; storeSettings(); };

const controlsLayer=document.getElementById('controlsLayer');
const joystickBase=document.getElementById('joystickBase');
const joystickThumb=document.getElementById('joystickThumb');
let touchId=null, baseCenterX=0, baseCenterY=0;
function resetTouch(){
  touchId=null; touchData.active=false; touchData.vx=0; touchData.vy=0; joystickBase.style.display='none'; joystickThumb.style.transform='translate(0px,0px)';
}
controlsLayer.addEventListener('touchstart', e => {
  if(touchId!==null) return;
  for(const t of e.changedTouches){
    if(t.clientX < innerWidth * 0.6){
      touchId=t.identifier;
      baseCenterX=t.clientX; baseCenterY=t.clientY;
      joystickBase.style.left=`${t.clientX}px`; joystickBase.style.top=`${t.clientY}px`; joystickBase.style.display='block';
      touchData.active=true; break;
    }
  }
}, {passive:true});
controlsLayer.addEventListener('touchmove', e => {
  for(const t of e.changedTouches){
    if(t.identifier===touchId){
      const dx=t.clientX-baseCenterX; const dy=t.clientY-baseCenterY;
      const len=Math.hypot(dx,dy);
      const max=48;
      const limited = len > max ? max/len : 1;
      const nx=dx*limited; const ny=dy*limited;
      joystickThumb.style.transform=`translate(${nx}px,${ny}px)`;
      touchData.vx = nx / 48;
      touchData.vy = ny / 48;
    }
  }
}, {passive:true});
controlsLayer.addEventListener('touchend', e => { for(const t of e.changedTouches){ if(t.identifier===touchId) resetTouch(); } }, {passive:true});
controlsLayer.addEventListener('touchcancel', resetTouch, {passive:true});

const keysMap = {KeyW:'KeyW',KeyA:'KeyA',KeyS:'KeyS',KeyD:'KeyD',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight'};
addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='Escape') togglePause(); });
addEventListener('keyup', e => { keys[e.code]=false; });

if(hasSave()){
  document.getElementById('continueGameBtn').hidden=false;
  document.getElementById('continueGameBtn').onclick=()=>{ loadSavedGame(); showMenu('none'); }; 
}
showMenu('startMenu');
renderChoices();
syncSettings();
requestAnimationFrame(function loop(){ update(); draw(); requestAnimationFrame(loop); });
</script>
