<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>馬鈴薯深空戰記 (Space Spud: Arena)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1c23;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}canvas{display:block;width:100%;height:100%;background:radial-gradient(circle at center,#252836,#101218)}#ui-layer{position:absolute;inset:0;padding:14px;pointer-events:none;z-index:20}.hud-top{display:flex;justify-content:space-between;align-items:flex-start}.hud-panel{display:flex;gap:14px;flex-wrap:wrap;background:#141923dc;border:2px solid #fc0;border-radius:10px;padding:9px 13px;font-size:13px;line-height:1.5;box-shadow:0 0 15px #fc04}.hud-panel span{color:#fc0;font-weight:bold}.btn-pause{pointer-events:auto;background:#101218;border:2px solid #fc0;color:#fc0;padding:9px 14px;border-radius:8px;font-weight:bold;cursor:pointer}.controls-layer{position:absolute;inset:0;display:none;z-index:10;touch-action:none}.touch-active .controls-layer{display:block}.stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #fc080;background:#ffffff12;pointer-events:none;display:none}.stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border:2px solid #fc0;border-radius:50%;background:#fc06}.modal-overlay{position:absolute;inset:0;z-index:100;background:#101218ed;backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;overflow:auto;text-align:center}.modal-overlay[style*="display: none"]{display:none!important}.modal-title{font-size:27px;color:#fc0;font-weight:800;text-shadow:0 0 18px #fc09;margin:5px 0}.modal-subtitle{font-size:13px;color:#b0b5c0;margin:6px 0 16px}.menu-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.btn-menu{border:0;border-radius:8px;padding:12px 22px;margin:5px;min-width:170px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#fc0,#f60);color:#101218}.btn-menu.secondary{background:#202838;color:#fc0;border:1px solid #fc08}.choice-grid,.weapon-grid,.shop-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(940px,96vw);margin:6px auto 12px}.choice-card,.weapon-card,.shop-card{width:195px;max-width:45vw;padding:12px;border:2px solid #fc06;border-radius:10px;background:#191e2af2;color:#fff;cursor:pointer;line-height:1.4}.choice-card.selected,.weapon-card.selected{border-color:#0fc;box-shadow:0 0 14px #0fc6}.choice-card strong,.weapon-card strong,.shop-card strong{display:block;color:#fc0;margin-bottom:5px}.choice-card small,.weapon-card small,.shop-card small{color:#c1c6d0;display:block}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;width:min(420px,90vw);padding:11px 14px;margin:4px 0;background:#191e2a;border:1px solid #fc06;border-radius:8px}.setting input[type=range]{width:145px}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:7px;width:min(760px,95vw);max-height:58vh;overflow:auto;padding:13px;margin:8px auto;background:#141923;border:1px solid #fc08;border-radius:10px}.stat-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #fff2;padding:6px 0;font-size:13px;text-align:left}.stat-item span:first-child{color:#b0b5c0}.stat-item span:last-child{color:#fc0;font-weight:700;text-align:right}.shop-card:disabled{opacity:.45}.boss-hud{position:absolute;top:104px;left:0;width:100%;text-align:center;pointer-events:none}@media(max-width:600px){.hud-panel{font-size:11px;padding:6px 8px;gap:7px}.choice-card,.weapon-card,.shop-card{font-size:11px;padding:8px}.stats-grid{grid-template-columns:1fr;max-height:55vh}.shop-card{width:44%}.modal-title{font-size:22px}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer"><div class="hud-top"><div class="hud-panel"><div>波次：<span id="hud-wave">1</span></div><div>生命：<span id="hud-hp">100/100</span></div><div>金幣：<span id="hud-gold">15</span></div><div>時間：<span id="hud-timer">30s</span></div></div><button class="btn-pause" id="pauseBtn">⏸</button></div></div>
<div class="controls-layer" id="controlsLayer"><div class="stick" id="joystickBase"><i id="joystickThumb"></i></div></div>
<div class="modal-overlay" id="startMenu"><div class="modal-title">馬鈴薯深空戰記</div><div class="modal-subtitle">SPACE SPUD: ARENA SURVIVAL</div><div class="menu-buttons"><button class="btn-menu" id="newGameBtn">開始戰鬥</button><button class="btn-menu secondary" id="continueGameBtn" hidden>繼續戰鬥</button><button class="btn-menu secondary" id="openSettingsBtn">設定</button></div></div>
<div class="modal-overlay" id="loadoutMenu" style="display:none"><div class="modal-title">選擇你的戰鬥配置</div><div class="modal-subtitle">選擇職業與武器後進入戰鬥</div><strong>職業</strong><div class="choice-grid" id="classChoices"></div><strong>武器</strong><div class="weapon-grid" id="weaponChoices"></div><div class="menu-buttons"><button class="btn-menu" id="beginBattleBtn">開始戰鬥</button><button class="btn-menu secondary" id="loadoutBackBtn">返回</button></div></div>
<div class="modal-overlay" id="settingsMenu" style="display:none"><div class="modal-title">遊戲設定</div><div class="modal-subtitle">設定會自動儲存在此瀏覽器</div><label class="setting"><span>音效開關</span><input type="checkbox" id="soundToggle"></label><label class="setting"><span>音量</span><input type="range" id="volumeSlider" min="0" max="100"><span id="volumeText">65%</span></label><label class="setting"><span>特效強度</span><input type="range" id="fxSlider" min="25" max="150"><span id="fxText">100%</span></label><div class="menu-buttons"><button class="btn-menu secondary" id="settingsBackBtn">返回</button></div></div>
<div class="modal-overlay" id="pauseMenu" style="display:none"><div class="modal-title">遊戲暫停</div><div class="modal-subtitle">角色能力與對局收益（逐項列出）</div><div class="stats-grid" id="statsGrid"></div><div class="menu-buttons"><button class="btn-menu" id="resumeBtn">返回戰鬥</button><button class="btn-menu secondary" id="saveExitBtn">離開</button></div></div>
<div class="modal-overlay" id="shopMenu" style="display:none"><div class="modal-title">戰利品商店 (SHOP)</div><div class="modal-subtitle">購買道具強化你的馬鈴薯！</div><div class="shop-grid" id="shopGrid"></div><button class="btn-menu" id="nextWaveBtn">下一波</button></div>
<div class="modal-overlay" id="gameOverMenu" style="display:none"><div class="modal-title" style="color:#ff3366">馬鈴薯倒下了 (GAME OVER)</div><div class="modal-subtitle" id="gameOverStats"></div><button class="btn-menu" id="restartBtn">重新開始</button></div>
<script>
'use strict';
const SAVE_KEY='spaceSpudArenaSaveV1',SETTINGS_KEY='spaceSpudSettingsV1';
const classes=[{id:'berserker',name:'狂戰士',desc:'近戰傷害 +35%，暴擊傷害 +35%。',melee:1.35,range:1,crit:0,critDamage:.35,summon:1},{id:'archer',name:'弓箭手',desc:'遠程傷害 +25%，射程 +25%。',melee:1,range:1.25,crit:0,critDamage:0,summon:1},{id:'summoner',name:'召喚師',desc:'召喚與魔法傷害 +80%，遠程魔彈額外攻擊。',melee:1,range:1,summon:1.8,crit:0,critDamage:0}];
const weapons=[{id:'knife',name:'刀',desc:'短距離、高頻率。',damage:1.25,range:110,cooldown:24,speed:14,kind:'melee',projectile:4,shape:'slash'},{id:'sword',name:'劍',desc:'近中距離，均衡輸出。',damage:1.15,range:150,cooldown:30,speed:13,kind:'melee',projectile:5,shape:'slash'},{id:'halberd',name:'長戟',desc:'長距離斬擊，打擊範圍大。',damage:1.55,range:200,cooldown:48,speed:12,kind:'melee',projectile:6,shape:'slash'},{id:'bow',name:'弓',desc:'快速箭矢。',damage:1.05,range:320,cooldown:38,speed:16,kind:'ranged',projectile:4,shape:'arrow'},{id:'crossbow',name:'十字弩',desc:'高傷害穿透。',damage:1.65,range:290,cooldown:55,speed:18,kind:'ranged',projectile:5,shape:'bolt'},{id:'cannon',name:'炮',desc:'重型爆炸砲彈。',damage:2.1,range:300,cooldown:72,speed:11,kind:'ranged',projectile:8,shape:'orb',splash:45}];
const settings={sound:true,volume:.65,effects:1};try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch(e){}
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let audioCtx=null;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playSound(type){if(!settings.sound||settings.volume<=0)return;initAudio();if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);o.type=type==='hit'?'sawtooth':'triangle';o.frequency.setValueAtTime(type==='hit'?180:type==='coin'?780:420,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08*settings.volume,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.start(t);o.stop(t+.09)}catch(e){}}
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resizeCanvas);resizeCanvas();
let gameState='START',wave=1,waveTimer=25,timerInterval=null,kills=0,shootCounter=0,enemySpawnCounter=0,shopChoiceIds=[],purchasedItemIds=[],classId='archer',weaponId='bow',summonCounter=0;
const newPlayer=()=>({x:canvas.width/2,y:canvas.height/2,radius:18,speed:4,maxHp:100,hp:100,hpRegen:0,armor:0,gold:15,attackSpeed:32,damage:20,range:240,vampire:0,critChance:.15,critDamage:1.5,dodgeChance:0,attractionRange:120,summonDamage:16,incomeBonus:0,revives:0,reflect:.0});
let player=newPlayer(),enemies=[],bullets=[],materials=[],particles=[],damageNumbers=[],slashes=[];const keys={},touchData={active:false,vx:0,vy:0};
function showMenu(id){document.querySelectorAll('.modal-overlay').forEach(el=>el.style.display='none');const el=document.getElementById(id);if(el)el.style.display='flex'}
function renderChoices(){document.getElementById('classChoices').innerHTML=classes.map(c=>`<button class="choice-card ${classId===c.id?'selected':''}" data-job="${c.id}"><strong>${c.name}</strong><small>${c.desc}</small></button>`).join('');document.getElementById('weaponChoices').innerHTML=weapons.map(w=>`<button class="weapon-card ${weaponId===w.id?'selected':''}" data-weapon="${w.id}"><strong>${w.name}</strong><small>${w.desc}<br>傷害 x${w.damage} · 攻擊距離 ${w.range} · 間隔 ${w.cooldown} 幀</small></button>`).join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{classId=b.dataset.job;renderChoices()});document.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>{weaponId=b.dataset.weapon;renderChoices()})}
const itemPool=[{id:'gun',title:'強化彈藥',desc:'攻擊傷害提升 8 點。',price:30,apply:()=>player.damage+=8},{id:'speed',title:'跑鞋',desc:'移動速度提升 20%。',price:25,apply:()=>player.speed*=1.2},{id:'attack',title:'快速連射',desc:'攻擊間隔減少 10%。',price:35,apply:()=>player.attackSpeed*=.9},{id:'vampire',title:'吸血之刃',desc:'每次命中恢復 0.2 生命。',price:40,apply:()=>player.vampire+=.2},{id:'maxhp',title:'生命補給',desc:'最大生命與目前生命 +35。',price:30,apply:()=>{player.maxHp+=35;player.hp+=35}},{id:'regen',title:'修復藥劑',desc:'每秒回復 1.5 生命。',price:35,apply:()=>player.hpRegen+=1.5},{id:'armor',title:'護盾模組',desc:'防禦 +10%。',price:45,apply:()=>player.armor=Math.min(.85,player.armor+.1)},{id:'crit',title:'會心瞄準器',desc:'暴擊率 +10%。',price:45,apply:()=>player.critChance=Math.min(.8,player.critChance+.1)},{id:'magnet',title:'磁力腰帶',desc:'吸收範圍 +20。',price:35,apply:()=>player.attractionRange+=20},{id:'summon',title:'元素契約',desc:'召喚傷害 +35%。',price:50,apply:()=>player.summonDamage*=1.35},{id:'income',title:'戰利品協議',desc:'擊殺金幣與戰利品收益 +25%。',price:45,apply:()=>player.incomeBonus+=.25},{id:'revive',title:'緊急復活核心',desc:'增加一次復活機會，復活時恢復 35% 生命。',price:65,apply:()=>player.revives++},{id:'reflect',title:'反傷裝甲',desc:'受到傷害時反彈 35% 實際傷害。',price:50,apply:()=>player.reflect=Math.min(.9,player.reflect+.35)}];
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}function nearestEnemy(x,y,r){let t=null,b=r;for(const e of enemies){const d=Math.hypot(e.x-x,e.y-y);if(d<b){b=d;t=e}}return t}
function spawnParticles(x,y,color,n=6,spread=1){const s=Math.max(.25,settings.effects);for(let i=0;i<Math.round(n*s);i++){const a=Math.random()*Math.PI*2,v=(Math.random()*3+1)*spread*s;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color,radius:Math.random()*3+1,decay:.015+Math.random()*.025})}}
function addDamageNumber(x,y,text,color='#fff',critical=false){damageNumbers.push({x,y,text,life:1,vy:-1.2,color,critical})}function addSlash(x,y,angle,length,ttl=.16,width=14){slashes.push({x,y,angle,length,ttl,life:ttl,width})}
function makeEnemy(type,x,y){const boss=type==='boss',elite=type==='elite',hp=boss?1800+wave*260:elite?260+wave*85:35+wave*18,radius=boss?36:elite?25:(Math.random()<.25?12:16),speed=boss?.8:elite?1.15:(Math.random()<.18?2.4:1.6)+wave*.05;return{x,y,type,radius,hp,maxHp:hp,speed,color:boss?'#c86bff':elite?'#ff9d42':'#ff3366',damage:boss?26:elite?18:8+wave*.4,cooldown:0}}
function spawnEnemy(type='normal'){const a=Math.random()*Math.PI*2,d=Math.max(canvas.width,canvas.height)/2+70;enemies.push(makeEnemy(type,player.x+Math.cos(a)*d,player.y+Math.sin(a)*d))}
function initWave(){player.x=canvas.width/2;player.y=canvas.height/2;enemies=[];bullets=[];materials=[];particles=[];damageNumbers=[];slashes=[];waveTimer=25+wave*5;enemySpawnCounter=0;gameState='PLAYING';if(wave%5===0)spawnEnemy('boss');else if(wave%3===0)spawnEnemy('elite');startTimer();saveGame()}
function startTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{if(gameState!=='PLAYING')return;waveTimer--;if(player.hpRegen>0&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+player.hpRegen);if(waveTimer<=0){clearInterval(timerInterval);triggerShop()}},1000)}
function startGame(){initAudio();try{localStorage.removeItem(SAVE_KEY)}catch(e){}wave=1;kills=0;shootCounter=0;enemySpawnCounter=0;summonCounter=0;player=newPlayer();enemies=[];bullets=[];materials=[];particles=[];damageNumbers=[];slashes=[];initWave();showMenu('none');updateStatsDisplay();updateHUD()}
function triggerShop(){initAudio();gameState='SHOP';shopChoiceIds=[...itemPool].sort(()=>Math.random()-.5).slice(0,4).map(x=>x.id);purchasedItemIds=[];renderShop();document.getElementById('shopMenu').style.display='flex';saveGame()}
function renderShop(){const grid=document.getElementById('shopGrid');grid.innerHTML='';for(const id of shopChoiceIds){const item=itemPool.find(x=>x.id===id);if(!item)continue;const card=document.createElement('button');card.className='shop-card';card.innerHTML=`<strong>${item.title}</strong><small>${item.desc}</small><br><em>價格：${item.price}</em>`;card.disabled=player.gold<item.price||purchasedItemIds.includes(id);card.onclick=()=>{if(player.gold<item.price||purchasedItemIds.includes(id))return;player.gold-=item.price;item.apply();purchasedItemIds.push(id);renderShop();updateHUD();updateStatsDisplay();saveGame()};grid.appendChild(card)}}
function startNextWave(){wave++;document.getElementById('shopMenu').style.display='none';initWave()}
function gameOver(){if(player.revives>0){player.revives--;player.hp=Math.max(1,Math.round(player.maxHp*.35));spawnParticles(player.x,player.y,'#0fc',28,1.5);addDamageNumber(player.x,player.y-30,'復活！','#0fc');return}gameState='GAMEOVER';if(timerInterval)clearInterval(timerInterval);try{localStorage.removeItem(SAVE_KEY)}catch(e){}document.getElementById('gameOverStats').textContent=`撐到了第 ${wave} 波｜擊殺 ${kills} 隻敵人｜金幣 ${player.gold}`;document.getElementById('gameOverMenu').style.display='flex'}
function updateHUD(){document.getElementById('hud-wave').textContent=wave;document.getElementById('hud-hp').textContent=`${Math.max(0,Math.floor(player.hp))}/${player.maxHp}`;document.getElementById('hud-gold').textContent=player.gold;document.getElementById('hud-timer').textContent=`${Math.max(0,waveTimer)}s`}
function updateStatsDisplay(){const c=classes.find(x=>x.id===classId)||classes[1],w=weapons.find(x=>x.id===weaponId)||weapons[3],rate=60/Math.max(7,Math.round(player.attackSpeed*w.cooldown/32)),dmg=player.damage*w.damage*(w.kind==='melee'?c.melee:c.range),critChance=1-(1-clamp(player.critChance,0,1))*(1-clamp(c.crit,0,1)),critMult=player.critDamage+c.critDamage,expected=dmg*(1+critChance*(critMult-1));const rows=[['職業',c.name],['武器',w.name],['單次基礎傷害',dmg.toFixed(1)],['預期傷害（含暴擊）',expected.toFixed(1)],['攻擊速度',`${rate.toFixed(2)} 次／秒`],['攻擊間隔',`${Math.max(7,Math.round(player.attackSpeed*w.cooldown/32))} 幀`],['攻擊距離',`${w.range} px${w.kind==='melee'?'（近戰範圍）':'（武器射程）'}`],['生命值',`${Math.max(0,Math.floor(player.hp))} / ${player.maxHp}`],['生命恢復',`${player.hpRegen.toFixed(1)} 生命／秒`],['命中吸血',`${player.vampire.toFixed(2)} 生命／次命中`],['防禦',`${(player.armor*100).toFixed(0)}% 減傷`],['移動速度',`${player.speed.toFixed(2)} px／幀`],['吸收範圍',`${player.attractionRange} px`],['對局收益加成',`${(player.incomeBonus*100).toFixed(0)}%（擊殺金幣與掉落物）`],['暴擊概率',`${(critChance*100).toFixed(1)}%`],['暴擊傷害',`${critMult.toFixed(2)} 倍`],['可復活次數',`${player.revives} 次（每次恢復 35% 生命）`],['反傷傷害',`${(player.reflect*100).toFixed(0)}% 實際受傷反彈`],['閃避概率',`${(player.dodgeChance*100).toFixed(0)}%`],['召喚傷害',`${player.summonDamage.toFixed(1)} 基礎值`],['金幣',`${player.gold}`],['擊殺數',`${kills}`]];document.getElementById('statsGrid').innerHTML=rows.map(([a,b])=>`<div class="stat-item"><span>${a}</span><span>${b}</span></div>`).join('')}
function togglePause(){if(gameState==='PLAYING'){gameState='PAUSE';updateStatsDisplay();document.getElementById('pauseMenu').style.display='flex';saveGame()}else if(gameState==='PAUSE'){gameState='PLAYING';document.getElementById('pauseMenu').style.display='none';startTimer();saveGame()}}
function saveGame(){if(!['PLAYING','PAUSE','SHOP'].includes(gameState))return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:3,gameState,wave,waveTimer,kills,player,enemies,bullets,materials,particles,damageNumbers,slashes,classId,weaponId,shopChoiceIds,purchasedItemIds}))}catch(e){}}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function loadSavedGame(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s||![2,3].includes(s.version))throw Error('invalid save');wave=s.wave||1;waveTimer=s.waveTimer||0;kills=s.kills||0;classId=s.classId||'archer';weaponId=s.weaponId||'bow';player={...newPlayer(),...s.player};enemies=s.enemies||[];bullets=s.bullets||[];materials=s.materials||[];particles=s.particles||[];damageNumbers=s.damageNumbers||[];slashes=s.slashes||[];shopChoiceIds=s.shopChoiceIds||[];purchasedItemIds=s.purchasedItemIds||[];if(s.gameState==='SHOP'){gameState='SHOP';document.getElementById('shopMenu').style.display='flex';renderShop()}else if(s.gameState==='PAUSE'){gameState='PAUSE';document.getElementById('pauseMenu').style.display='flex'}else{gameState='PLAYING';startTimer()}updateHUD();updateStatsDisplay()}catch(e){try{localStorage.removeItem(SAVE_KEY)}catch(_e){}}}
function drawBar(e){const w=e.type==='boss'?Math.max(48,e.radius*2.4):Math.max(26,e.radius*2.4),h=e.type==='boss'?8:5,x=e.x-w/2,y=e.y-e.radius-10,r=clamp(e.hp/e.maxHp,0,1);ctx.fillStyle='#000b';ctx.fillRect(x,y,w,h);ctx.fillStyle=e.type==='boss'?'#c86bff':r>.6?'#32d59d':'#ffcd58';ctx.fillRect(x,y,w*r,h)}
function drawBullet(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillStyle=b.color||'#fff';if(b.shape==='arrow'){ctx.beginPath();ctx.moveTo(b.radius+6,0);ctx.lineTo(-b.radius-6,-b.radius*.8);ctx.lineTo(-b.radius-6,b.radius*.8);ctx.closePath();ctx.fill()}else if(b.shape==='bolt'){ctx.fillRect(-b.radius-7,-b.radius*.7,b.radius*2+14,b.radius*1.4)}else{ctx.beginPath();ctx.arc(0,0,b.radius+(b.shape==='orb'?2:1),0,Math.PI*2);ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}for(const s of slashes){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);ctx.strokeStyle=`rgba(255,204,0,${clamp(s.life/s.ttl,0,1)})`;ctx.shadowBlur=15;ctx.shadowColor='#fc0';ctx.lineWidth=s.width;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s.length,0);ctx.stroke();ctx.restore()}for(const b of bullets)drawBullet(b);for(const e of enemies){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();drawBar(e);if(e.type==='boss'||e.type==='elite'){ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(e.type==='boss'?'BOSS':'ELITE',e.x,e.y-e.radius-17)}}for(const m of materials){ctx.fillStyle='#0fc';ctx.shadowBlur=8;ctx.shadowColor='#0fc';ctx.beginPath();ctx.arc(m.x,m.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,p.radius),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const d of damageNumbers){ctx.globalAlpha=clamp(d.life,0,1);ctx.fillStyle=d.color;ctx.font=`bold ${d.critical?18:14}px Arial`;ctx.textAlign='center';ctx.fillText(d.text,d.x,d.y)}ctx.globalAlpha=1;
// Classic orange potato hero, restored from the earlier visual style.
ctx.save();ctx.shadowBlur=14;ctx.shadowColor='#fc0';ctx.fillStyle='#d4883b';ctx.strokeStyle='#5a3818';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(player.x,player.y,18,22,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#101218';ctx.beginPath();ctx.arc(player.x-5,player.y-3,2.5,0,Math.PI*2);ctx.arc(player.x+5,player.y-3,2.5,0,Math.PI*2);ctx.fill();ctx.restore();const boss=enemies.find(e=>e.type==='boss');if(boss){const w=Math.min(canvas.width-40,900),x=(canvas.width-w)/2,y=110;ctx.fillStyle='#21132a';ctx.fillRect(x,y,w,13);ctx.fillStyle='#bd55f5';ctx.fillRect(x,y,w*clamp(boss.hp/boss.maxHp,0,1),13);ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('BOSS — 馬鈴薯深空戰記',canvas.width/2,y-5)}}
function dealEnemyDamage(e,amount,critical=false){e.hp-=amount;addDamageNumber(e.x,e.y-e.radius,`${Math.round(amount)}`,critical?'#ffd66b':'#fff',critical);if(player.vampire>0)player.hp=Math.min(player.maxHp,player.hp+player.vampire)}
function damagePlayer(amount,source){if(Math.random()<player.dodgeChance){addDamageNumber(player.x,player.y-28,'閃避','#7af0ff');return}const actual=Math.max(1,amount*(1-player.armor));player.hp-=actual;spawnParticles(player.x,player.y,'#ff334d',10,1.1);if(source&&player.reflect>0&&source.hp>0){const reflected=actual*player.reflect;source.hp-=reflected;addDamageNumber(source.x,source.y-source.radius,`${Math.round(reflected)} 反傷`,'#0fc');spawnParticles(source.x,source.y,'#0fc',4)}if(player.hp<=0){if(player.revives>0){player.revives--;player.hp=Math.max(1,Math.round(player.maxHp*.35));spawnParticles(player.x,player.y,'#0fc',28,1.5);addDamageNumber(player.x,player.y-30,'復活！','#0fc')}else gameOver()}}
function update(){if(gameState!=='PLAYING')return;let mx=0,my=0;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(touchData.active){mx=touchData.vx;my=touchData.vy}if(mx||my){const l=Math.hypot(mx,my)||1;player.x=clamp(player.x+mx/l*player.speed,player.radius,canvas.width-player.radius);player.y=clamp(player.y+my/l*player.speed,player.radius,canvas.height-player.radius)}
if(wave%5!==0&&++enemySpawnCounter>=Math.max(32,120-wave*5)){enemySpawnCounter=0;for(let n=0;n<Math.min(7,1+Math.floor((wave-1)/3));n++)spawnEnemy(Math.random()<Math.min(.4,.2+wave*.005)?'fast':'normal')}
const weapon=weapons.find(w=>w.id===weaponId)||weapons[3],job=classes.find(c=>c.id===classId)||classes[1],interval=Math.max(7,Math.round(player.attackSpeed*weapon.cooldown/32));if(++shootCounter>=interval){shootCounter=0;const target=nearestEnemy(player.x,player.y,weapon.range+220),angle=Math.atan2((target?target.y:player.y+my*90)-player.y,(target?target.x:player.x+mx*90)-player.x);if(weapon.kind==='melee'){addSlash(player.x,player.y,angle,weapon.range+30,.12,weapon.id==='halberd'?18:weapon.id==='sword'?15:12);const hits=enemies.filter(e=>{const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),diff=Math.abs(Math.atan2(Math.sin(a-angle),Math.cos(a-angle)));return d<=weapon.range+e.radius+18&&diff<1.2}).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));for(const e of hits.slice(0,weapon.id==='halberd'?4:weapon.id==='sword'?3:2)){const crit=Math.random()<player.critChance;dealEnemyDamage(e,player.damage*weapon.damage*job.melee*(crit?player.critDamage+job.critDamage:1),crit)}playSound('hit')}else{bullets.push({x:player.x,y:player.y,vx:Math.cos(angle)*weapon.speed,vy:Math.sin(angle)*weapon.speed,damage:player.damage*weapon.damage*job.range,radius:weapon.projectile,color:weapon.id==='crossbow'?'#ffb84d':weapon.id==='cannon'?'#ff734d':'#7bdff2',shape:weapon.shape,crit:Math.random()<player.critChance,life:120,splash:weapon.splash||0});playSound('coin')}}
if(classId==='summoner'&&++summonCounter>=34){summonCounter=0;const e=nearestEnemy(player.x,player.y,370);if(e){const a=Math.atan2(e.y-player.y,e.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,damage:player.summonDamage*job.summon,radius:5,color:'#0fc',shape:'orb',crit:false,life:120,splash:0})}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;let hit=false;for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.radius+(b.radius||4)){hit=true;const dmg=b.damage*(b.crit?player.critDamage:1);dealEnemyDamage(e,dmg,b.crit);spawnParticles(e.x,e.y,b.color,b.splash?10:6,1.2);if(b.splash)for(const o of enemies)if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<b.splash)dealEnemyDamage(o,dmg*.45);break}}if(hit||b.life<=0||b.x< -50||b.x>canvas.width+50||b.y< -50||b.y>canvas.height+50)bullets.splice(i,1)}
for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=.016;if(slashes[i].life<=0)slashes.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],d=Math.hypot(player.x-e.x,player.y-e.y)||1;e.x+=(player.x-e.x)/d*e.speed;e.y+=(player.y-e.y)/d*e.speed;if(d<e.radius+player.radius+2)damagePlayer(e.damage,e);if(e.hp<=0){kills++;const gold=e.type==='boss'?18:e.type==='elite'?8:3;player.gold+=Math.round(gold*(1+player.incomeBonus));spawnParticles(e.x,e.y,e.color,e.type==='boss'?35:15,1.6);materials.push({x:e.x,y:e.y,value:Math.max(1,Math.round((e.type==='boss'?25:e.type==='elite'?8:3)*(1+wave*.08)*(1+player.incomeBonus)))});enemies.splice(i,1)}}
for(let i=materials.length-1;i>=0;i--){const m=materials[i],d=Math.hypot(player.x-m.x,player.y-m.y);if(d<player.attractionRange){const a=Math.atan2(player.y-m.y,player.x-m.x),v=Math.min(9,4+(player.attractionRange-d)*.05);m.x+=Math.cos(a)*v;m.y+=Math.sin(a)*v;if(d<player.radius+10){player.gold+=m.value;materials.splice(i,1)}}}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=p.decay}particles=particles.filter(p=>p.life>0);for(const d of damageNumbers){d.y+=d.vy;d.life-=.02}damageNumbers=damageNumbers.filter(d=>d.life>0);if(player.hp>0&&waveTimer<=0&&enemies.length===0&&document.getElementById('shopMenu').style.display!=='flex')triggerShop();updateHUD();if(gameState==='PAUSE')updateStatsDisplay()}
function bind(id,fn){document.getElementById(id).addEventListener('click',fn)}bind('newGameBtn',()=>{renderChoices();showMenu('loadoutMenu')});bind('beginBattleBtn',()=>{if(classes.some(c=>c.id===classId)&&weapons.some(w=>w.id===weaponId))startGame()});bind('loadoutBackBtn',()=>showMenu('startMenu'));bind('openSettingsBtn',()=>{syncSettings();showMenu('settingsMenu')});bind('settingsBackBtn',()=>showMenu('startMenu'));bind('pauseBtn',togglePause);bind('resumeBtn',togglePause);bind('saveExitBtn',()=>{saveGame();if(timerInterval)clearInterval(timerInterval);gameState='START';showMenu('startMenu')});bind('nextWaveBtn',startNextWave);bind('restartBtn',()=>{document.getElementById('gameOverMenu').style.display='none';startGame()});
function syncSettings(){soundToggle.checked=settings.sound;volumeSlider.value=Math.round(settings.volume*100);volumeText.textContent=`${Math.round(settings.volume*100)}%`;fxSlider.value=Math.round(settings.effects*100);fxText.textContent=`${Math.round(settings.effects*100)}%`}function storeSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}}soundToggle.onchange=e=>{settings.sound=e.target.checked;storeSettings()};volumeSlider.oninput=e=>{settings.volume=Number(e.target.value)/100;volumeText.textContent=`${e.target.value}%`;storeSettings()};fxSlider.oninput=e=>{settings.effects=Number(e.target.value)/100;fxText.textContent=`${e.target.value}%`;storeSettings()};
const controlsLayer=document.getElementById('controlsLayer'),joystickBase=document.getElementById('joystickBase'),joystickThumb=document.getElementById('joystickThumb');let touchId=null,baseX=0,baseY=0;function resetTouch(){touchId=null;touchData.active=false;touchData.vx=touchData.vy=0;joystickBase.style.display='none';joystickThumb.style.transform='translate(0px,0px)'}if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch-active');controlsLayer.addEventListener('touchstart',e=>{if(touchId!==null)return;for(const t of e.changedTouches){if(t.clientX<innerWidth*.62){touchId=t.identifier;baseX=t.clientX;baseY=t.clientY;joystickBase.style.left=`${baseX}px`;joystickBase.style.top=`${baseY}px`;joystickBase.style.display='block';touchData.active=true;break}}},{passive:true});controlsLayer.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===touchId){const dx=t.clientX-baseX,dy=t.clientY-baseY,len=Math.hypot(dx,dy),max=48,k=len>max?max/len:1,nx=dx*k,ny=dy*k;joystickThumb.style.transform=`translate(${nx}px,${ny}px)`;touchData.vx=nx/max;touchData.vy=ny/max}},{passive:true});controlsLayer.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===touchId)resetTouch()},{passive:true});controlsLayer.addEventListener('touchcancel',resetTouch,{passive:true});addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')togglePause()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveGame()});setInterval(saveGame,1500);
if(hasSave()){continueGameBtn.hidden=false;continueGameBtn.onclick=()=>{loadSavedGame();showMenu('none')}}showMenu('startMenu');renderChoices();syncSettings();requestAnimationFrame(function loop(){update();draw();requestAnimationFrame(loop)});
