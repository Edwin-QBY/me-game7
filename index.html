<head>

<title>馬鈴薯深空戰記 (Space Spud: Arena)</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1c23;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}#gameCanvas{display:block;width:100%;height:100%;background:radial-gradient(circle at center,#252836 0%,#101218 100%)}#ui-layer{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:15px;z-index:20}.hud-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%}.hud-panel{background:rgba(20,25,35,.85);border:2px solid #fc0;border-radius:10px;padding:10px 15px;backdrop-filter:blur(5px);box-shadow:0 0 15px #ffcc004d}.player-stats{font-size:13px;line-height:1.5}.player-stats span{color:#fc0;font-weight:bold}.btn-pause-hud{pointer-events:auto;background:#ffcc0033;border:2px solid #fc0;color:#fc0;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer;position:relative;z-index:30}.controls-layer{position:absolute;inset:0;pointer-events:auto;display:none;z-index:10;touch-action:none}.touch-active .controls-layer{display:block}.joystick-base{position:absolute;width:120px;height:120px;margin:-60px;background:#ffffff14;border:2px solid #ffcc0080;border-radius:50%;pointer-events:none;display:none}.joystick-thumb{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px;background:#ffcc0066;border:2px solid #fc0;border-radius:50%;pointer-events:none}.modal-overlay{position:absolute;inset:0;background:#101218eb;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;pointer-events:auto;padding:20px;overflow:auto}.modal-title{font-size:28px;font-weight:bold;color:#fc0;text-shadow:0 0 20px #ffcc0099;margin-bottom:8px;letter-spacing:2px;text-align:center}.modal-subtitle{font-size:13px;color:#b0b5c0;margin-bottom:18px;text-align:center;padding:0 15px}.btn-main{background:linear-gradient(135deg,#fc0,#f60);color:#101218;border:0;padding:12px 25px;margin:5px;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;box-shadow:0 0 20px #ffcc0066;min-width:190px}.btn-secondary{background:rgba(30,38,53,.95);border:1px solid #ffcc0080;color:#fc0;box-shadow:none}.choice-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:min(900px,96%);margin:7px auto 15px}.choice-card{width:195px;max-width:45vw;background:#191e2af2;border:2px solid #ffcc0066;border-radius:10px;padding:12px;text-align:center;color:#fff;cursor:pointer;line-height:1.45}.choice-card.selected{border-color:#00ffcc;box-shadow:0 0 16px #00ffcc66}.choice-card strong{display:block;color:#fc0;margin-bottom:5px}.choice-card small{color:#c0c5d0}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;width:min(420px,90vw);padding:12px;margin:4px;background:#191e2af2;border-radius:8px}.setting-row input[type=range]{width:150px}.shop-grid{display:flex;gap:12px;max-width:950px;width:90%;justify-content:center;flex-wrap:wrap}.shop-card{background:#191e2af2;border:2px solid #ffcc0066;border-radius:10px;padding:12px;width:190px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center}.shop-card-title{font-size:14px;font-weight:bold;color:#fc0;margin-bottom:5px}.shop-card-desc{font-size:11px;color:#b0b5c0;line-height:1.4;margin-bottom:8px}.shop-card-price{font-size:12px;color:#0fc;font-weight:bold}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:560px;width:95%;background:#141923e6;border:2px solid #ffcc0066;border-radius:12px;padding:14px;margin-bottom:15px}.stat-item{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid #ffffff14}.stat-label{color:#b0b5c0}.stat-value{color:#0fc;font-weight:bold;text-align:right}.menu-buttons{display:flex;flex-wrap:wrap;justify-content:center}.boss-hud{position:absolute;top:110px;left:0;width:100%;text-align:center;pointer-events:none;z-index:5}@media(max-width:600px){.modal-title{font-size:23px}.choice-card{width:44%;font-size:12px;padding:9px}.stats-grid{grid-template-columns:1fr}.stat-item{font-size:12px}.setting-row{width:95%}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer"><div class="hud-top"><div class="hud-panel player-stats"><div>波次 (Wave): <span id="hud-wave">1</span></div><div>生命值 (HP): <span id="hud-hp">100/100</span></div><div>金幣 (Materials): <span id="hud-gold">0</span></div><div>存活倒數: <span id="hud-time">25s</span></div></div><button class="btn-pause-hud" id="pauseBtn">暫停 / 數據</button></div></div>
<div class="controls-layer" id="controlsLayer"><div class="joystick-base" id="joystickBase"><div class="joystick-thumb" id="joystickThumb"></div></div></div>
<div class="modal-overlay" id="startMenu"><div class="modal-title">馬鈴薯深空戰記</div><div class="modal-subtitle">SPACE SPUD: ARENA SURVIVAL</div><div class="menu-buttons"><button class="btn-main" id="newGameBtn">開始戰鬥</button><button class="btn-main" id="continueBtn" style="display:none">繼續上次對局</button><button class="btn-main btn-secondary" id="settingsHomeBtn">設定</button></div></div>
<div class="modal-overlay" id="loadoutMenu" style="display:none"><div class="modal-title">選擇你的戰鬥配置</div><div class="modal-subtitle">選擇職業與武器後進入戰鬥</div><strong style="color:#00ffcc">職業</strong><div class="choice-grid" id="classChoices"></div><strong style="color:#00ffcc">武器</strong><div class="choice-grid" id="weaponChoices"></div><div class="menu-buttons"><button class="btn-main" id="beginBattleBtn">確認並開始</button><button class="btn-main btn-secondary" id="loadoutBackBtn">返回主頁</button></div></div>
<div class="modal-overlay" id="settingsMenu" style="display:none"><div class="modal-title">遊戲設定</div><div class="modal-subtitle">設定會自動儲存在此瀏覽器</div><label class="setting-row">音效 <input type="checkbox" id="soundToggle"></label><label class="setting-row">特效音量 <input type="range" id="volumeSlider" min="0" max="100" value="65"><span id="volumeValue">65%</span></label><label class="setting-row">特效明顯程度 <input type="range" id="effectsSlider" min="25" max="150" value="100"><span id="effectsValue">100%</span></label><button class="btn-main btn-secondary" id="settingsBackBtn">返回</button></div>
<div class="modal-overlay" id="pauseMenu" style="display:none"><div class="modal-title">遊戲暫停</div><div class="modal-subtitle">當前角色數值</div><div class="stats-grid" id="statsGrid"></div><button class="btn-main" id="resumeBtn">返回戰鬥</button><button class="btn-main btn-secondary" id="saveExitBtn">儲存並返回主頁</button></div>
<div class="modal-overlay" id="shopMenu" style="display:none"><div class="modal-title">戰利品商店 (SHOP)</div><div class="modal-subtitle">購買道具強化你的馬鈴薯！</div><div class="shop-grid" id="shopGrid"></div><button class="btn-main" id="nextWaveBtn" style="margin-top:20px">下一波戰鬥</button></div>
<div class="modal-overlay" id="gameOverMenu" style="display:none"><div class="modal-title" style="color:#ff3366">馬鈴薯倒下了 (GAME OVER)</div><div class="modal-subtitle" id="gameOverStats"></div><button class="btn-main" id="restartBtn">再次挑戰</button></div>
<script>
'use strict';
const SAVE_KEY='spaceSpudArenaSaveV1',SETTINGS_KEY='spaceSpudSettingsV1';
const classes=[{id:'berserker',name:'狂戰士',desc:'近戰武器傷害 +35%，暴擊傷害 +35%。',melee:1.35,range:1,crit:.35,summon:1},{id:'archer',name:'弓箭手',desc:'遠程傷害 +25%，射程 +12%。',melee:1,range:1.25,crit:0,summon:1},{id:'summoner',name:'召喚師',desc:'召喚物傷害 +80%，召喚物攻擊更快。',melee:1,range:1,crit:0,summon:1.8}];
const weapons=[{id:'knife',name:'刀',desc:'近距離、高頻率。',damage:1.25,range:95,cooldown:24,speed:14,kind:'melee',projectile:4},{id:'sword',name:'劍',desc:'近中距離，均衡輸出。',damage:1.15,range:145,cooldown:30,speed:13,kind:'melee',projectile:5},{id:'halberd',name:'戟',desc:'中距離、高傷害、攻速較慢。',damage:1.55,range:190,cooldown:48,speed:12,kind:'melee',projectile:6},{id:'fork',name:'叉',desc:'中距離、快速連擊。',damage:1.05,range:205,cooldown:27,speed:15,kind:'melee',projectile:4},{id:'spear',name:'槍',desc:'長距離、均衡傷害。',damage:1.2,range:255,cooldown:36,speed:14,kind:'melee',projectile:5},{id:'bow',name:'弓',desc:'遠程、穩定輸出。',damage:1.05,range:320,cooldown:38,speed:12,kind:'ranged',projectile:4},{id:'crossbow',name:'弩',desc:'高傷害、射速較慢。',damage:1.65,range:290,cooldown:55,speed:15,kind:'ranged',projectile:5},{id:'cannon',name:'炮',desc:'範圍爆炸、高傷害、攻速慢。',damage:2.1,range:300,cooldown:72,speed:8,kind:'ranged',projectile:8,splash:48}];
const settings={sound:true,volume:.65,effects:1};try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch(e){}
let audioCtx=null;function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playSound(type){if(!settings.sound||settings.volume<=0)return;initAudio();if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.connect(g);g.connect(audioCtx.destination);o.type=type==='hit'?'sawtooth':type==='coin'?'sine':'triangle';o.frequency.setValueAtTime(type==='coin'?800:type==='hit'?120:400,now);o.frequency.exponentialRampToValueAtTime(type==='coin'?1400:type==='hit'?30:100,now+(type==='hit'?.08:.05));g.gain.setValueAtTime((type==='coin'?.13:.08)*settings.volume,now);g.gain.linearRampToValueAtTime(.001,now+(type==='hit'?.08:.1));o.start(now);o.stop(now+(type==='hit'?.08:.1))}catch(e){}}
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resizeCanvas);resizeCanvas();
let gameState='START',wave=1,waveTimer=25,timerInterval=null,kills=0,shootCounter=0,enemySpawnCounter=0,shopChoiceIds=[],purchasedItemIds=[],classId='archer',weaponId='bow',summonCounter=0;
let player={x:canvas.width/2,y:canvas.height/2,radius:18,speed:4,maxHp:100,hp:100,hpRegen:0,armor:0,gold:15,attackSpeed:32,damage:20,range:240,vampire:0,critChance:.15,critDamage:1.5,dodgeChance:0,attractionRange:85,incomeMultiplier:1,reflectDamage:0,reviveCharges:0,summonDamage:16};
let enemies=[],bullets=[],materials=[],particles=[],damageNumbers=[];
const itemPool=[{id:'gun',title:'強化彈藥',desc:'攻擊傷害提升 8 點。',price:30,apply:()=>player.damage+=8},{id:'speed',title:'跑鞋',desc:'移動速度提升 20%。',price:25,apply:()=>player.speed+=1},{id:'attackSpeed',title:'咖啡因',desc:'攻擊頻率提高。',price:35,apply:()=>player.attackSpeed=Math.max(8,player.attackSpeed-6)},{id:'vampire',title:'吸血牙齒',desc:'擊殺敵人時有 20% 機率回復 6 點生命。',price:40,apply:()=>player.vampire+=.2},{id:'maxhp',title:'馬鈴薯外皮',desc:'最大生命值增加 35 點並補滿。',price:30,apply:()=>{player.maxHp+=35;player.hp=player.maxHp}},{id:'regen',title:'再生核心',desc:'每秒自動回復 1.5 點生命。',price:35,apply:()=>player.hpRegen+=1.5},{id:'armor',title:'鈦金裝甲',desc:'獲得 10% 傷害減免（上限 75%）。',price:40,apply:()=>player.armor=Math.min(.75,player.armor+.1)},{id:'crit',title:'精密瞄具',desc:'暴擊率 +10%，暴擊傷害 +25%。',price:45,apply:()=>{player.critChance+=.1;player.critDamage+=.25}},{id:'revive',title:'復活甲',desc:'獲得一次倒下時復活機會，恢復 35% 生命。',price:65,apply:()=>player.reviveCharges++},{id:'thorns',title:'反甲核心',desc:'受近身傷害時反彈 35% 傷害。',price:50,apply:()=>player.reflectDamage+=.35},{id:'magnet',title:'引力磁鐵',desc:'金幣吸引範圍增加 100。',price:35,apply:()=>player.attractionRange+=100},{id:'dodge',title:'相位披風',desc:'閃避率 +8%（上限 60%）。',price:45,apply:()=>player.dodgeChance=Math.min(.6,player.dodgeChance+.08)},{id:'income',title:'豐收徽章',desc:'每隻怪物掉落金幣 +25%。',price:45,apply:()=>player.incomeMultiplier+=.25},{id:'summon',title:'召喚晶核',desc:'召喚物傷害永久提升 35%。',price:40,apply:()=>player.summonDamage*=1.35}];
const keys={};let touchData={active:false,vx:0,vy:0};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')togglePause()});addEventListener('keyup',e=>keys[e.code]=false);if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch-active');
const controlsLayer=document.getElementById('controlsLayer'),joystickBase=document.getElementById('joystickBase'),joystickThumb=document.getElementById('joystickThumb');let joystickTouchId=null,baseCenterX=0,baseCenterY=0;
controlsLayer.addEventListener('touchstart',e=>{if(joystickTouchId!==null)return;for(const t of e.changedTouches){if(t.clientX<innerWidth*.6){joystickTouchId=t.identifier;baseCenterX=t.clientX;baseCenterY=t.clientY;joystickBase.style.left=baseCenterX+'px';joystickBase.style.top=baseCenterY+'px';joystickBase.style.display='block';touchData.active=true;touchData.vx=touchData.vy=0;break}}},{passive:true});controlsLayer.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joystickTouchId){let dx=t.clientX-baseCenterX,dy=t.clientY-baseCenterY,d=Math.hypot(dx,dy),max=45;if(d>max){dx=dx/d*max;dy=dy/d*max}joystickThumb.style.transform=`translate(${dx}px,${dy}px)`;touchData.vx=dx/max;touchData.vy=dy/max;break}}},{passive:true});function resetJoystick(){joystickTouchId=null;touchData.active=false;touchData.vx=touchData.vy=0;joystickBase.style.display='none';joystickThumb.style.transform='translate(0,0)'}controlsLayer.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joystickTouchId){resetJoystick();break}},{passive:true});controlsLayer.addEventListener('touchcancel',resetJoystick);
function bind(id,fn){document.getElementById(id).addEventListener('click',fn)}bind('newGameBtn',showLoadout);bind('beginBattleBtn',startGame);bind('loadoutBackBtn',()=>showMenu('startMenu'));bind('settingsHomeBtn',()=>showSettings('startMenu'));bind('settingsBackBtn',()=>showMenu(settingsReturnMenu));bind('continueBtn',loadSavedGame);bind('restartBtn',startGame);bind('pauseBtn',togglePause);bind('resumeBtn',togglePause);bind('saveExitBtn',saveAndExit);bind('nextWaveBtn',startNextWave);
function showMenu(id){document.querySelectorAll('.modal-overlay').forEach(el=>el.style.display='none');document.getElementById(id).style.display='flex'}let settingsReturnMenu='startMenu';function showSettings(returnTo){settingsReturnMenu=returnTo;syncSettingsUI();showMenu('settingsMenu')}function syncSettingsUI(){document.getElementById('soundToggle').checked=!!settings.sound;document.getElementById('volumeSlider').value=Math.round(settings.volume*100);document.getElementById('volumeValue').textContent=Math.round(settings.volume*100)+'%';document.getElementById('effectsSlider').value=Math.round(settings.effects*100);document.getElementById('effectsValue').textContent=Math.round(settings.effects*100)+'%'}function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}}document.getElementById('soundToggle').addEventListener('change',e=>{settings.sound=e.target.checked;saveSettings()});document.getElementById('volumeSlider').addEventListener('input',e=>{settings.volume=Number(e.target.value)/100;document.getElementById('volumeValue').textContent=e.target.value+'%';saveSettings()});document.getElementById('effectsSlider').addEventListener('input',e=>{settings.effects=Number(e.target.value)/100;document.getElementById('effectsValue').textContent=e.target.value+'%';saveSettings()});
function showLoadout(){renderChoices();showMenu('loadoutMenu')}function renderChoices(){document.getElementById('classChoices').innerHTML=classes.map(c=>`<button class="choice-card ${classId===c.id?'selected':''}" data-class="${c.id}"><strong>${c.name}</strong><small>${c.desc}</small></button>`).join('');document.getElementById('weaponChoices').innerHTML=weapons.map(w=>`<button class="choice-card ${weaponId===w.id?'selected':''}" data-weapon="${w.id}"><strong>${w.name}</strong><small>${w.desc}<br>傷害 ${w.damage}×｜距離 ${w.range}｜間隔 ${w.cooldown} 幀</small></button>`).join('');document.querySelectorAll('[data-class]').forEach(el=>el.addEventListener('click',()=>{classId=el.dataset.class;renderChoices()}));document.querySelectorAll('[data-weapon]').forEach(el=>el.addEventListener('click',()=>{weaponId=el.dataset.weapon;renderChoices()}))}
function startGame(){initAudio();try{localStorage.removeItem(SAVE_KEY)}catch(e){}wave=1;kills=0;shootCounter=0;player={x:canvas.width/2,y:canvas.height/2,radius:18,speed:4,maxHp:100,hp:100,hpRegen:0,armor:0,gold:15,attackSpeed:32,damage:20,range:240,vampire:0,critChance:.15,critDamage:1.5,dodgeChance:0,attractionRange:85,incomeMultiplier:1,reflectDamage:0,reviveCharges:0,summonDamage:16};purchasedItemIds=[];document.getElementById('continueBtn').style.display='none';initWave()}
function makeEnemy(type,x,y){const boss=type==='boss',elite=type==='elite',hp=boss?1800+wave*260:elite?260+wave*85:35+wave*18,radius=boss?36:elite?25:Math.random()<.25?12:16;return{x,y,type,radius,speed:boss?0:elite?.85+wave*.025:(radius===12?2.4:1.45)+wave*.075,hp,maxHp:hp,damage:boss?30+wave*4:elite?20+wave*2.5:12+wave*2,color:boss?'#b24cff':elite?'#ff9d24':radius===12?'#ff3366':'#ff6633',attackCooldown:boss?55:elite?145:0,telegraph:null}}
function spawnEnemy(type){const a=Math.random()*Math.PI*2,d=Math.max(canvas.width,canvas.height)/2+70;enemies.push(makeEnemy(type,player.x+Math.cos(a)*d,player.y+Math.sin(a)*d))}
function initWave(){player.x=canvas.width/2;player.y=canvas.height/2;enemies=[];bullets=[];materials=[];particles=[];damageNumbers=[];waveTimer=25+wave*5;enemySpawnCounter=0;gameState='PLAYING';if(wave%5===0)spawnEnemy('boss');else if(wave%3===0)spawnEnemy('elite');startTimer();saveGame()}
function startTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{if(gameState==='PLAYING'){waveTimer--;if(player.hpRegen>0&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+player.hpRegen);if(waveTimer<=0){clearInterval(timerInterval);triggerShop()}saveGame()}},1000)}
function togglePause(){if(gameState==='PLAYING'){gameState='PAUSE';updateStatsDisplay();document.getElementById('pauseMenu').style.display='flex';saveGame()}else if(gameState==='PAUSE'){document.getElementById('pauseMenu').style.display='none';gameState='PLAYING';saveGame()}}
function updateStatsDisplay(){const c=classes.find(x=>x.id===classId),w=weapons.find(x=>x.id===weaponId);document.getElementById('statsGrid').innerHTML=`<div class="stat-item"><span class="stat-label">職業 / 武器</span><span class="stat-value">${c?.name||'—'} / ${w?.name||'—'}</span></div><div class="stat-item"><span class="stat-label">生命值</span><span class="stat-value">${Math.floor(player.hp)} / ${player.maxHp}</span></div><div class="stat-item"><span class="stat-label">生命回復</span><span class="stat-value">+${player.hpRegen.toFixed(1)} / 秒</span></div><div class="stat-item"><span class="stat-label">防禦減傷 / 閃避率</span><span class="stat-value">${(player.armor*100).toFixed(0)}% / ${(player.dodgeChance*100).toFixed(0)}%</span></div><div class="stat-item"><span class="stat-label">移動速度</span><span class="stat-value">${player.speed.toFixed(1)}</span></div><div class="stat-item"><span class="stat-label">攻擊傷害</span><span class="stat-value">${player.damage}</span></div><div class="stat-item"><span class="stat-label">攻擊速度</span><span class="stat-value">${(60/player.attackSpeed).toFixed(1)} 發/秒</span></div><div class="stat-item"><span class="stat-label">暴擊率 / 暴擊傷害</span><span class="stat-value">${(player.critChance*100).toFixed(0)}% / ${(player.critDamage*100).toFixed(0)}%</span></div><div class="stat-item"><span class="stat-label">金幣吸引範圍</span><span class="stat-value">${Math.round(player.attractionRange)} px</span></div><div class="stat-item"><span class="stat-label">每隻怪物金幣加成</span><span class="stat-value">+${Math.round((player.incomeMultiplier-1)*100)}%</span></div><div class="stat-item"><span class="stat-label">反傷 / 復活次數</span><span class="stat-value">${Math.round(player.reflectDamage*100)}% / ${player.reviveCharges}</span></div><div class="stat-item"><span class="stat-label">召喚物傷害</span><span class="stat-value">${Math.round(player.summonDamage*(c?.summon||1))}</span></div>`}
function startNextWave(){wave++;document.getElementById('shopMenu').style.display='none';initWave()}
function spawnParticles(x,y,color,count=6){const scale=Math.max(.25,settings.effects);for(let i=0;i<Math.round(count*scale);i++){const a=Math.random()*Math.PI*2,s=(Math.random()*3+1)*scale;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,alpha:Math.min(1,settings.effects),decay:(Math.random()*.04+.03)/scale,color,radius:(Math.random()*3+1)*scale})}}
function startTelegraph(e){const angle=Math.atan2(player.y-e.y,player.x-e.x);e.telegraph={angle,elapsed:0,duration:e.type==='boss'?48:95,length:e.type==='boss'?Math.max(canvas.width,canvas.height):Math.max(canvas.width,canvas.height)*.72,width:e.type==='boss'?100:65}}
function updateEnemyAttacks(){for(const e of enemies){if(e.type!=='elite'&&e.type!=='boss')continue;if(e.telegraph){const a=e.telegraph;a.elapsed++;if(a.elapsed>=a.duration){const dx=player.x-e.x,dy=player.y-e.y,along=dx*Math.cos(a.angle)+dy*Math.sin(a.angle),side=Math.abs(-dx*Math.sin(a.angle)+dy*Math.cos(a.angle));if(along>0&&along<a.length&&side<a.width/2+player.radius)damagePlayer(e.damage*(1-player.armor),e.x,e.y);e.telegraph=null;e.attackCooldown=e.type==='boss'?85:210}else continue}if(e.attackCooldown>0)e.attackCooldown--;else startTelegraph(e)}}
function damagePlayer(amount,sourceX=player.x,sourceY=player.y){if(Math.random()<player.dodgeChance){damageNumbers.push({x:player.x,y:player.y-28,value:'閃避',isCrit:false,life:1,vy:-1});return}player.hp-=amount;playSound('hit');spawnParticles(player.x,player.y,'#ff334d',Math.round(8*settings.effects));if(player.reflectDamage>0){const e=enemies.find(enemy=>Math.hypot(enemy.x-sourceX,enemy.y-sourceY)<enemy.radius+8);if(e)e.hp-=amount*player.reflectDamage}if(player.hp<=0){if(player.reviveCharges>0){player.reviveCharges--;player.hp=Math.max(1,player.maxHp*.35);spawnParticles(player.x,player.y,'#00ffcc',30)}else gameOver()}}
function update(){if(gameState!=='PLAYING')return;let mx=0,my=0;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(touchData.active&&(touchData.vx||touchData.vy)){mx=touchData.vx;my=touchData.vy}if(mx&&my){mx*=.7071;my*=.7071}player.x=Math.max(player.radius,Math.min(canvas.width-player.radius,player.x+mx*player.speed));player.y=Math.max(player.radius,Math.min(canvas.height-player.radius,player.y+my*player.speed));
if(wave%5!==0&&++enemySpawnCounter>=Math.max(32,120-wave*5)){enemySpawnCounter=0;const batch=Math.min(7,1+Math.floor((wave-1)/3));for(let n=0;n<batch;n++)spawnEnemy(Math.random()<Math.min(.4,.2+wave*.005)?'fast':'normal')}
const weapon=weapons.find(w=>w.id===weaponId)||weapons[5],job=classes.find(c=>c.id===classId)||classes[1];const attackInterval=Math.max(7,Math.round(player.attackSpeed*weapon.cooldown/32));if(++shootCounter>=attackInterval){shootCounter=0;let target=null,dmin=Math.min(player.range,weapon.range*(weapon.kind==='melee'?job.melee:job.range));for(const e of enemies){const d=Math.hypot(e.x-player.x,e.y-player.y);if(d<dmin){dmin=d;target=e}}if(target){const a=Math.atan2(target.y-player.y,target.x-player.x),crit=Math.random()<player.critChance,melee=weapon.kind==='melee',dmg=player.damage*weapon.damage*(melee?job.melee:job.range)*(crit?player.critDamage*(1+job.crit):1);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*weapon.speed,vy:Math.sin(a)*weapon.speed,damage:dmg,isCrit:crit,radius:weapon.projectile,splash:weapon.splash||0,color:weapon.id==='cannon'?'#ff8844':crit?'#ff3366':'#ffcc00'});playSound('shoot')}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.radius+b.radius){const impacted={x:e.x,y:e.y};const targets=b.splash?enemies.filter(other=>Math.hypot(other.x-impacted.x,other.y-impacted.y)<=b.splash):[e];for(const victim of targets){victim.hp-=b.damage;damageNumbers.push({x:victim.x,y:victim.y-victim.radius-8,value:Math.round(b.damage),isCrit:b.isCrit,life:1,vy:b.isCrit?-1.35:-1});spawnParticles(victim.x,victim.y,b.isCrit?'#ff3366':'#ffcc00',b.isCrit?6:3)}hit=true;break}}if(hit||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height)bullets.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.hp<=0){kills++;spawnParticles(e.x,e.y,'#ff3366',e.type==='boss'?40:15);materials.push({x:e.x,y:e.y,value:Math.max(1,Math.round((e.type==='boss'?25+wave*2:3+wave)*player.incomeMultiplier))});if(player.vampire>0&&Math.random()<player.vampire)player.hp=Math.min(player.maxHp,player.hp+6);enemies.splice(i,1);continue}if(e.type!=='boss'){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed;e.y+=Math.sin(a)*e.speed;if(Math.hypot(player.x-e.x,player.y-e.y)<player.radius+e.radius){damagePlayer(e.damage*(1-player.armor),e.x,e.y);if(gameState!=='PLAYING')return}}}
updateEnemyAttacks();if(gameState!=='PLAYING')return;
if(classId==='summoner'){summonCounter++;const interval=Math.max(18,48-Math.floor((player.summonDamage-16)/2));if(summonCounter>=interval){summonCounter=0;let target=null,dmin=360;for(const e of enemies){const d=Math.hypot(e.x-player.x,e.y-player.y);if(d<dmin){dmin=d;target=e}}if(target){const a=Math.atan2(target.y-player.y,target.x-player.x);bullets.push({x:player.x+Math.cos(a)*30,y:player.y+Math.sin(a)*30,vx:Math.cos(a)*9,vy:Math.sin(a)*9,damage:player.summonDamage*job.summon,isCrit:false,radius:5,splash:0,color:'#00ffcc',summon:true})}}}
for(let i=materials.length-1;i>=0;i--){const m=materials[i],d=Math.hypot(player.x-m.x,player.y-m.y);if(d<player.attractionRange){const a=Math.atan2(player.y-m.y,player.x-m.x),pull=Math.min(9,4+(player.attractionRange-d)*.035);m.x+=Math.cos(a)*pull;m.y+=Math.sin(a)*pull;if(d<player.radius+10){player.gold+=m.value;playSound('coin');materials.splice(i,1)}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;if(p.alpha<=0)particles.splice(i,1)}for(let i=damageNumbers.length-1;i>=0;i--){const n=damageNumbers[i];n.y+=n.vy;n.life-=.025;if(n.life<=0)damageNumbers.splice(i,1)}updateHUD()}
function updateHUD(){document.getElementById('hud-wave').textContent=wave;document.getElementById('hud-hp').textContent=`${Math.max(0,Math.floor(player.hp))}/${player.maxHp}`;document.getElementById('hud-gold').textContent=player.gold;document.getElementById('hud-time').textContent=waveTimer+'s'}
function renderShop(){const grid=document.getElementById('shopGrid');grid.innerHTML='';for(const id of shopChoiceIds){const item=itemPool.find(x=>x.id===id);if(!item)continue;const card=document.createElement('div');card.className='shop-card';card.innerHTML=`<div class="shop-card-title">${item.title}</div><div class="shop-card-desc">${item.desc}</div><div class="shop-card-price">價格: $${item.price}</div>`;if(purchasedItemIds.includes(id)){card.style.opacity='.4';card.style.pointerEvents='none'}card.addEventListener('click',()=>{if(!purchasedItemIds.includes(id)&&player.gold>=item.price){player.gold-=item.price;item.apply();purchasedItemIds.push(id);card.style.opacity='.4';card.style.pointerEvents='none';playSound('coin');saveGame()}});grid.appendChild(card)}document.getElementById('shopMenu').style.display='flex'}
function triggerShop(){initAudio();gameState='SHOP';shopChoiceIds=[...itemPool].sort(()=>Math.random()-.5).slice(0,4).map(x=>x.id);purchasedItemIds=[];renderShop();saveGame()}
function gameOver(){gameState='GAMEOVER';if(timerInterval)clearInterval(timerInterval);try{localStorage.removeItem(SAVE_KEY)}catch(e){}document.getElementById('gameOverStats').textContent=`撐到了第 ${wave} 波 | 總擊殺數: ${kills} | 最終金幣: ${player.gold}`;showMenu('gameOverMenu')}
function drawEnemyHealthBar(e){const w=e.type==='boss'?Math.max(48,e.radius*2.4):Math.max(26,e.radius*2.4),h=e.type==='boss'?8:5,x=e.x-w/2,y=e.y-e.radius-10,r=Math.max(0,Math.min(1,e.hp/e.maxHp));ctx.fillStyle='#000c';ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle='#55202b';ctx.fillRect(x,y,w,h);ctx.fillStyle=e.type==='boss'?'#c86bff':r>.5?'#35e06f':r>.25?'#fc0':'#ff4455';ctx.fillRect(x,y,w*r,h)}
function drawTelegraph(e){if(!e.telegraph)return;const a=e.telegraph,progress=Math.min(1,a.elapsed/a.duration),intensity=settings.effects;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(a.angle);ctx.fillStyle=`rgba(255,35,55,${.12*intensity})`;ctx.fillRect(0,-a.width/2,a.length,a.width);ctx.fillStyle=`rgba(255,25,45,${Math.min(.95,(.25+.55*progress)*intensity)})`;ctx.fillRect(0,-a.width/2,a.length*progress,a.width);ctx.strokeStyle=`rgba(255,80,90,${Math.min(1,.8*intensity)})`;ctx.lineWidth=2;ctx.strokeRect(0,-a.width/2,a.length,a.width);ctx.restore()}
function drawBossBar(){const boss=enemies.find(e=>e.type==='boss');if(!boss)return;const w=Math.min(canvas.width-40,900),h=14,x=(canvas.width-w)/2,y=115,r=Math.max(0,boss.hp/boss.maxHp);ctx.save();ctx.fillStyle='#000c';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#40164f';ctx.fillRect(x,y,w,h);ctx.fillStyle='#bd55f5';ctx.fillRect(x,y,w*r,h);ctx.textAlign='center';ctx.textBaseline='bottom';ctx.font='bold 14px Arial';ctx.fillStyle='#f0c4ff';ctx.fillText('BOSS — 深空巨獸',canvas.width/2,y-5);ctx.restore()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}for(const m of materials){ctx.fillStyle='#00ffcc';ctx.beginPath();ctx.arc(m.x,m.y,5,0,Math.PI*2);ctx.fill()}for(const e of enemies)drawTelegraph(e);for(const p of particles){ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();ctx.restore()}for(const b of bullets){ctx.fillStyle=b.color||'#ffcc00';ctx.beginPath();ctx.arc(b.x,b.y,b.radius||4,0,Math.PI*2);ctx.fill()}for(const e of enemies){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();drawEnemyHealthBar(e);if(e.type==='elite'||e.type==='boss'){ctx.fillStyle='#fff';ctx.font=`bold ${e.type==='boss'?18:13}px Arial`;ctx.textAlign='center';ctx.fillText(e.type==='boss'?'BOSS':'精英',e.x,e.y-e.radius-19)}}for(const n of damageNumbers){ctx.save();ctx.globalAlpha=Math.max(0,n.life);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${n.isCrit?20:14}px Arial`;ctx.lineWidth=3;ctx.strokeStyle='#000c';ctx.fillStyle=n.isCrit?'#ff334d':'#fff';const text=(n.isCrit?'✦ ':'')+n.value;ctx.strokeText(text,n.x,n.y);ctx.fillText(text,n.x,n.y);ctx.restore()}drawBossBar();if(['PLAYING','PAUSE','SHOP'].includes(gameState)){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#d4883b';ctx.beginPath();ctx.ellipse(0,0,player.radius,player.radius*1.2,0,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#5a3818';ctx.stroke();ctx.fillStyle='#101218';ctx.beginPath();ctx.arc(-5,-3,2.5,0,Math.PI*2);ctx.arc(5,-3,2.5,0,Math.PI*2);ctx.fill();if(classId==='summoner'){ctx.strokeStyle='#00ffcc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,player.radius+9,0,Math.PI*2);ctx.stroke()}ctx.restore()}}
function saveGame(){if(!['PLAYING','PAUSE','SHOP'].includes(gameState))return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:2,gameState,wave,waveTimer,kills,shootCounter,enemySpawnCounter,player,enemies,bullets,materials,particles,damageNumbers,shopChoiceIds,purchasedItemIds,classId,weaponId,summonCounter}))}catch(e){}}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function loadSavedGame(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s||![1,2].includes(s.version))throw Error('invalid save');wave=s.wave;waveTimer=s.waveTimer;kills=s.kills;shootCounter=s.shootCounter||0;enemySpawnCounter=s.enemySpawnCounter||0;player={...player,...s.player};enemies=s.enemies||[];bullets=s.bullets||[];materials=s.materials||[];particles=s.particles||[];damageNumbers=s.damageNumbers||[];shopChoiceIds=s.shopChoiceIds||[];purchasedItemIds=s.purchasedItemIds||[];classId=s.classId||classId;weaponId=s.weaponId||weaponId;summonCounter=s.summonCounter||0;document.getElementById('startMenu').style.display='none';if(s.gameState==='SHOP'){gameState='SHOP';renderShop()}else{gameState='PAUSE';updateStatsDisplay();document.getElementById('pauseMenu').style.display='flex'}initAudio();startTimer();updateHUD()}catch(e){try{localStorage.removeItem(SAVE_KEY)}catch(_){}document.getElementById('continueBtn').style.display='none'}}
function saveAndExit(){saveGame();if(timerInterval)clearInterval(timerInterval);gameState='START';document.getElementById('pauseMenu').style.display='none';document.getElementById('startMenu').style.display='flex';document.getElementById('continueBtn').style.display=hasSave()?'inline-block':'none'}
addEventListener('pagehide',saveGame);addEventListener('beforeunload',saveGame);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveGame()});setInterval(saveGame,1500);if(hasSave())document.getElementById('continueBtn').style.display='inline-block';
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
